<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Falling for You — Star Shooter</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#050818;font-family:'Courier New',monospace}
#c{position:fixed;top:0;left:0;touch-action:none}
.ov{position:fixed;inset:0;pointer-events:none}
.vign{background:radial-gradient(ellipse at 50% 60%,transparent 30%,rgba(3,4,14,.75)100%)}
.grain{opacity:.045;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.4'/%3E%3C/svg%3E");
  background-size:200px 200px}

.scr{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;color:#e8e2d4;opacity:0;transition:opacity .6s ease;pointer-events:none}
.scr.on{opacity:1;pointer-events:all}
#hud.on{pointer-events:none!important}

#intro .badge{letter-spacing:.35em;font-size:9px;opacity:.35;margin-bottom:10px;text-transform:uppercase}
#intro h1{font-family:Georgia,serif;font-size:clamp(32px,7vw,56px);font-weight:300;
  letter-spacing:.05em;margin:0 0 6px;text-align:center;line-height:1.1}
#intro .sub{font-size:10px;opacity:.25;margin-bottom:48px;letter-spacing:.28em;text-align:center}
#intro .hint{position:absolute;bottom:28px;font-size:9px;opacity:.18;
  letter-spacing:.14em;animation:pulse 3s ease infinite;text-align:center;padding:0 20px}
.gbtn{background:transparent;border:1px solid rgba(232,226,210,.3);color:rgba(232,226,210,.7);
  padding:14px 48px;letter-spacing:.28em;font-size:11px;font-family:'Courier New',monospace;
  cursor:pointer;text-transform:uppercase;-webkit-appearance:none;border-radius:0;
  min-width:160px;min-height:50px}
.gbtn:active{border-color:rgba(232,226,210,.8);color:#e8e2d4}

#scoreEl{position:fixed;top:18px;left:0;right:0;text-align:center;font-size:11px;opacity:.3;letter-spacing:.18em}
#waveEl{position:fixed;top:18px;right:18px;font-size:10px;opacity:.28;letter-spacing:.1em}
#comboEl{position:fixed;top:40px;left:0;right:0;text-align:center;
  font-family:Georgia,serif;font-style:italic;font-size:clamp(20px,5vw,36px);
  color:rgba(232,226,210,0);text-shadow:0 0 30px rgba(200,180,255,.8);pointer-events:none}
#comboEl.show{animation:comboPop .8s ease forwards}
#lyricEl{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);
  font-family:Georgia,serif;font-style:italic;font-size:clamp(15px,4vw,26px);
  color:rgba(255,240,210,0);text-align:center;text-shadow:0 0 40px rgba(200,180,255,.9);
  padding:0 24px;max-width:90vw;pointer-events:none}
#lyricEl.show{animation:lyricFloat 2.8s ease forwards}
#hpBar{position:fixed;bottom:0;left:0;right:0;height:3px;background:rgba(232,226,210,.07)}
#hpFill{height:100%;background:rgba(232,226,210,.35);transition:width .3s ease;width:100%}

/* wish */
#wishModal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;
  justify-content:center;background:rgba(3,4,14,.85);
  opacity:0;pointer-events:none;transition:opacity .4s ease}
#wishModal.on{opacity:1;pointer-events:all}
.wishBox{background:rgba(6,8,22,.96);border:1px solid rgba(200,180,255,.15);
  padding:38px 26px 30px;max-width:min(330px,86vw);width:100%;
  display:flex;flex-direction:column;align-items:center;gap:18px;
  transform:translateY(14px);transition:transform .4s cubic-bezier(.16,1,.3,1)}
#wishModal.on .wishBox{transform:translateY(0)}
.wishStar{font-size:26px;animation:wishSpin 5s linear infinite}
@keyframes wishSpin{from{filter:hue-rotate(0)}to{filter:hue-rotate(360deg)}}
.wishLabel{font-family:Georgia,serif;font-style:italic;font-size:14px;
  color:rgba(220,210,255,.82);text-align:center;line-height:1.65}
.wishLabel span{font-size:9px;display:block;font-style:normal;
  color:rgba(200,190,255,.3);letter-spacing:.22em;margin-top:6px;
  font-family:'Courier New',monospace;text-transform:uppercase}
#wishInput{width:100%;background:transparent;border:none;
  border-bottom:1px solid rgba(200,180,255,.22);color:#e8e2d4;
  font-family:Georgia,serif;font-style:italic;font-size:18px;
  padding:10px 4px;text-align:center;outline:none;
  -webkit-user-select:text!important;user-select:text!important;
  caret-color:rgba(200,180,255,.6)}
#wishInput::placeholder{color:rgba(200,180,255,.2);font-style:italic}
.wishSend{background:transparent;border:1px solid rgba(200,180,255,.22);
  color:rgba(200,180,255,.62);padding:12px 32px;letter-spacing:.22em;font-size:10px;
  font-family:'Courier New',monospace;cursor:pointer;text-transform:uppercase;
  -webkit-appearance:none;border-radius:0;min-height:46px}
.wishSend:active{border-color:rgba(200,180,255,.7);color:rgba(220,210,255,.95)}

/* end */
#end{background:rgba(3,4,14,.9)}
.pol{background:#f0ead8;padding:13px 13px 50px;
  box-shadow:0 28px 72px rgba(0,0,0,.72);
  max-width:min(288px,78vw);width:100%;
  transform:translateY(20px);opacity:0;
  transition:transform .6s cubic-bezier(.16,1,.3,1),opacity .6s ease}
.pol.show{transform:translateY(0);opacity:1}
.pol img{width:100%;display:block;filter:brightness(3.5)saturate(0)blur(8px);
  transition:filter 1.3s .35s ease}
.pol img.dev{filter:brightness(1)saturate(1)blur(0)}
.ptxt{text-align:center;padding-top:10px}
.ptxt .ti{font-family:Georgia,serif;font-style:italic;font-size:16px;color:#1a1510;margin:0 0 4px}
.ptxt .ar{font-size:8px;color:#9a907e;letter-spacing:.14em;text-transform:uppercase;margin:0 0 3px}
.ptxt .me{font-size:8px;color:#c0b8a8;letter-spacing:.05em;max-width:220px;
  display:block;margin:0 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;justify-content:center;
  transform:translateY(12px);opacity:0;
  transition:transform .5s cubic-bezier(.16,1,.3,1) .4s,opacity .5s .4s}
.brow.show{transform:translateY(0);opacity:1}
.btn{background:transparent;border:1px solid rgba(232,226,210,.28);
  color:rgba(232,226,210,.55);padding:12px 22px;letter-spacing:.16em;font-size:10px;
  font-family:'Courier New',monospace;cursor:pointer;text-transform:uppercase;
  -webkit-appearance:none;border-radius:0;min-height:46px}
.btn.ig{background:linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045);
  border:none;color:#fff;box-shadow:0 4px 20px rgba(253,29,29,.28)}
.btn:active{opacity:.75}

#flash{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:20}
#flash.go{animation:flashAnim .5s ease-out forwards}
#dmgFlash{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:18;background:rgba(255,60,60,.15)}
#dmgFlash.go{animation:dmgAnim .35s ease-out forwards}
#toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);
  background:rgba(200,180,255,.1);border:1px solid rgba(200,180,255,.18);
  color:rgba(220,210,255,.7);padding:8px 18px;font-size:9px;
  letter-spacing:.13em;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}

@keyframes pulse{0%,100%{opacity:.2}50%{opacity:.36}}
@keyframes comboPop{0%{opacity:0;transform:scale(.7)}25%{opacity:.9;transform:scale(1.08)}60%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(.95)}}
@keyframes lyricFloat{0%{opacity:0;transform:translate(-50%,-45%)}20%{opacity:1;transform:translate(-50%,-50%)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-64%)}}
@keyframes flashAnim{0%{opacity:1;background:rgba(230,220,255,.22)}100%{opacity:0}}
@keyframes dmgAnim{0%{opacity:1}100%{opacity:0}}
</style>
</head>
<body>
<audio id="bgm" src="Falling_for_You.mp3" loop preload="auto"></audio>

<canvas id="c"></canvas>
<div class="ov grain"></div>
<div class="ov vign"></div>
<div id="flash"></div>
<div id="dmgFlash"></div>

<div id="intro" class="scr on">
  <p class="badge">Ian Chung ft. Martello</p>
  <h1>Falling<br>for You</h1>
  <p class="sub">shoot the falling stars</p>
  <button id="beginBtn" class="gbtn">Begin</button>
  <p class="hint">drag to move · hold to shoot · ✦ rare star grants a wish</p>
</div>

<div id="hud" class="scr">
  <div id="scoreEl">0  pts</div>
  <div id="waveEl">wave 1</div>
  <div id="comboEl"></div>
  <div id="lyricEl"></div>
  <button id="snapBtn" style="
    position:fixed;top:16px;right:16px;
    background:transparent;
    border:1px solid rgba(232,226,210,.22);
    color:rgba(232,226,210,.45);
    width:42px;height:42px;border-radius:50%;
    font-size:16px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    -webkit-appearance:none;z-index:10;
    transition:all .25s;letter-spacing:0">📷</button>
  <div id="hpBar"><div id="hpFill"></div></div>
</div>

<div id="wishModal">
  <div class="wishBox">
    <div class="wishStar">✦</div>
    <div class="wishLabel">
      you caught the rarest star
      <span>make a wish</span>
    </div>
    <input id="wishInput" type="text" maxlength="40"
      placeholder="write your wish..."
      autocomplete="off" autocorrect="off" spellcheck="false">
    <button id="wishSendBtn" class="wishSend">Send it to the stars</button>
  </div>
</div>

<div id="end" class="scr">
  <div class="pol" id="pol">
    <img id="snapImg" src="" alt="">
    <div class="ptxt">
      <p class="ti">Falling for You</p>
      <p class="ar">Ian Chung × Martello</p>
      <p class="me" id="bmeta"></p>
      <p style="font-size:8px;color:#b0a898;letter-spacing:.18em;text-transform:uppercase;margin-top:5px">Out on June 5, 2026</p>
    </div>
  </div>
  <div class="brow" id="brow">
    <button id="igBtn" class="btn ig">Story ↗</button>
    <button id="saveBtn" class="btn">Save</button>
    <button id="againBtn" class="btn">Again</button>
  </div>
</div>
<div id="toast"></div>

<script>
'use strict';
const TAU = Math.PI * 2;
const rnd = (a, b) => a + Math.random() * (b - a);
const C = document.getElementById('c');
const X = C.getContext('2d');
let W, H, gY;

// ─── PRE-RENDERED OFFSCREEN CANVASES ─────────────
// Star textures — drawn once, reused every frame
const starCache = {};
function getStarSprite(r, hue, rare) {
  const key = `${Math.round(r)}_${hue}_${rare}`;
  if (starCache[key]) return starCache[key];
  const size = Math.ceil(r * 10);
  const oc = document.createElement('canvas');
  oc.width = oc.height = size * 2;
  const ox = oc.getContext('2d');
  const cx = size, cy = size;

  // outer glow — soft radial
  const gl = ox.createRadialGradient(cx, cy, 0, cx, cy, size);
  gl.addColorStop(0, `hsla(${hue},${rare?15:50}%,${rare?99:85}%,${rare?.55:.38})`);
  gl.addColorStop(.5, `hsla(${hue},${rare?15:50}%,${rare?99:85}%,.08)`);
  gl.addColorStop(1, 'rgba(0,0,0,0)');
  ox.beginPath(); ox.arc(cx, cy, size, 0, TAU); ox.fillStyle = gl; ox.fill();

  // abstract star shape — 4-pointed cross + diagonal haze
  const pts = rare ? 6 : 4;
  const outer = r;
  const inner = r * (rare ? .22 : .18);
  ox.save(); ox.translate(cx, cy);

  // main star spikes
  ox.beginPath();
  for (let i = 0; i < pts * 2; i++) {
    const a = (i / (pts * 2)) * TAU - TAU / 4;
    const rad = i % 2 === 0 ? outer : inner;
    i === 0 ? ox.moveTo(Math.cos(a)*rad, Math.sin(a)*rad)
             : ox.lineTo(Math.cos(a)*rad, Math.sin(a)*rad);
  }
  ox.closePath();
  ox.fillStyle = `hsla(${hue},${rare?10:45}%,${rare?99:90}%,.95)`;
  ox.fill();

  // long thin cross streaks (lens flare feel)
  const streakLen = rare ? r * 2.8 : r * 2.2;
  const streakW = rare ? 1.4 : .9;
  [[0, streakLen], [TAU/4, streakLen * .7]].forEach(([angle, len]) => {
    ox.save(); ox.rotate(angle);
    const sg = ox.createLinearGradient(0, -len, 0, len);
    sg.addColorStop(0, 'rgba(255,255,255,0)');
    sg.addColorStop(.5, `hsla(${hue},20%,98%,${rare?.8:.65})`);
    sg.addColorStop(1, 'rgba(255,255,255,0)');
    ox.fillStyle = sg;
    ox.fillRect(-streakW/2, -len, streakW, len*2);
    ox.restore();
  });

  // tiny bright center
  ox.beginPath(); ox.arc(0, 0, r * .18, 0, TAU);
  ox.fillStyle = rare ? 'rgba(255,245,255,.98)' : 'rgba(240,235,255,.95)';
  ox.fill();

  ox.restore();
  starCache[key] = oc;
  return oc;
}

// ─── AUDIO ───────────────────────────────────────
const Snd = {
  ac: null, rev: null, mst: null,
  init() {
    try {
      this.ac = new (window.AudioContext || window.webkitAudioContext)();
      if (this.ac.state === 'suspended') this.ac.resume();
      this.mst = this.ac.createGain(); this.mst.gain.value = 0;
      this.mst.connect(this.ac.destination);
      this.rev = this._rv(5);
      const rg = this.ac.createGain(); rg.gain.value = .76;
      this.rev.connect(rg); rg.connect(this.mst);
      const dg = this.ac.createGain(); dg.gain.value = .24;
      dg.connect(this.mst);
      this._pads(dg);
      this.mst.gain.setTargetAtTime(.7, this.ac.currentTime, 3);
    } catch(e) {}
  },
  _rv(d) {
    const c = this.ac, cv = c.createConvolver();
    const n = c.sampleRate * d, b = c.createBuffer(2, n, c.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const dat = b.getChannelData(ch);
      for (let i = 0; i < n; i++) dat[i] = (Math.random()*2-1) * Math.pow(1-i/n, 1.4);
    }
    cv.buffer = b; return cv;
  },
  _pads(dry) {
    [110, 164.81, 220, 261.63].forEach((f, i) => {
      const o = this.ac.createOscillator(), g = this.ac.createGain();
      o.type = 'sine'; o.frequency.value = f; g.gain.value = .005 / (i * .5 + 1);
      const lfo = this.ac.createOscillator(), lg = this.ac.createGain();
      lfo.frequency.value = .04 + i * .016; lg.gain.value = .003;
      lfo.connect(lg); lg.connect(g.gain); lfo.start();
      o.connect(g); g.connect(this.rev); g.connect(dry); o.start();
    });
  },
  _sh(f, v, d, dur) {
    if (!this.ac) return;
    const t = this.ac.currentTime + d;
    const o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(v, t + dur * .25);
    g.gain.setTargetAtTime(0, t + dur * .3, dur * .35);
    o.connect(g); g.connect(this.rev); g.connect(this.mst);
    o.start(t); o.stop(t + dur + .5);
  },
  shoot() { this._sh(1600, .12, 0, .07); },
  hit(big) {
    if (big) { [1,1.26,1.5,1.78].forEach((r,i) => this._sh(330*r, .18, i*.06, 2)); }
    else { this._sh([523,659,784,880][Math.floor(Math.random()*4)], .15, 0, 1.4); }
  },
  dmg() {
    if (!this.ac) return;
    const o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = 'sawtooth'; o.frequency.value = 110;
    o.frequency.exponentialRampToValueAtTime(55, this.ac.currentTime + .15);
    g.gain.setValueAtTime(.18, this.ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, this.ac.currentTime + .2);
    o.connect(g); g.connect(this.mst); o.start(); o.stop(this.ac.currentTime + .22);
  },
  rare() { [1,1.12,1.26,1.50,1.68,2].forEach((r,i) => this._sh(261.63*r, .045, i*.15, 5)); },
  shutter() {
    if (!this.ac) return;
    const buf = this.ac.createBuffer(1, this.ac.sampleRate * .6, this.ac.sampleRate);
    const dat = buf.getChannelData(0);
    for (let i = 0; i < dat.length; i++) dat[i] = (Math.random()*2-1) * .3;
    const src = this.ac.createBufferSource(), g = this.ac.createGain(), f = this.ac.createBiquadFilter();
    src.buffer = buf; f.type = 'highpass'; f.frequency.value = 4000;
    g.gain.setValueAtTime(.055, this.ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, this.ac.currentTime + .6);
    src.connect(f); f.connect(g); g.connect(this.rev); g.connect(this.mst);
    src.start(); src.stop(this.ac.currentTime + .65);
  },
  fadeOut() { if (this.mst) this.mst.gain.setTargetAtTime(0, this.ac.currentTime, 1.8); }
};

// ─── CONFIG ──────────────────────────────────────
const MAX_HP = 5, SHOOT_CD = 130;
const LYRICS = ["falling for you","for real, for real","too good to be real","don't wake me up","better than dreams","right here","found my way"];
const METEOR_HUES = { common: 260, cool: 200, warm: 340, rare: 270 };

// ─── STATE ───────────────────────────────────────
let phase = 'intro';
let player = { x: 0, y: 0, tx: 0, ty: 0 };
let bullets = [], meteors = [], particles = [], rings = [], bgStars = [];
let hp = MAX_HP, score = 0, combo = 0, lastHit = 0;
let wave = 1, waveTimer = 0, waveKills = 0, waveTarget = 8;
let shooting = false, lastShot = 0;
let running = false, raf = null;
let lastWishText = '', lyricIdx = 0;
let screenShake = 0;

function resize() {
  W = C.width = window.innerWidth;
  H = C.height = window.innerHeight;
  gY = H * .8;
  player.x = player.tx = W / 2;
  player.y = player.ty = H * .82;
  bgStars = Array.from({length: 120}, () => ({
    x: rnd(0, W), y: rnd(0, H * .85),
    sz: rnd(.2, 1.4), base: rnd(.1, .75),
    ph: rnd(0, TAU), sp: rnd(.005, .02)
  }));
}

// ─── FACTORIES ───────────────────────────────────
function mkMeteor() {
  const rare = Math.random() < .04;
  const types = ['common', 'cool', 'warm'];
  const type = rare ? 'rare' : types[Math.floor(Math.random() * 3)];
  const pat = Math.floor(rnd(0, 3));
  const r = rare ? 16 : rnd(8, 13);
  return {
    type, x: rnd(W * .08, W * .92), y: -30,
    vx: rnd(-.5, .5) * (1 + wave * .07),
    vy: rnd(.5, 1.0) + wave * .04,
    hp: rare ? 5 : 1, maxHp: rare ? 5 : 1,
    r, rare, hue: METEOR_HUES[type],
    pat, patPh: rnd(0, TAU), age: 0,
    trail: [], sprite: null
  };
}

function mkBullet(x, y) {
  return { x, y, vy: -15, alive: true };
}

function mkParticles(x, y, n, hue, big) {
  const arr = [];
  for (let i = 0; i < n; i++) {
    const a = rnd(0, TAU), sp = rnd(big ? 1.5 : .8, big ? 6 : 3.5);
    arr.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - .5,
      t: 0, dur: rnd(18, big ? 40 : 28),
      r: rnd(.8, big ? 3.5 : 2), hue, sat: rnd(30, 55)
    });
  }
  return arr;
}

function mkRing(x, y, hue) {
  return { x, y, r: 0, maxR: rnd(28, 52), hue, t: 0 };
}

// ─── SHOOT ───────────────────────────────────────
function tryShoot() {
  if (phase !== 'playing') return;
  const now = Date.now();
  if (now - lastShot < SHOOT_CD) return;
  lastShot = now;
  bullets.push(mkBullet(player.x, player.y - 18));
  Snd.shoot();
}

// ─── UPDATE (logic only, no drawing) ─────────────
function update() {
  if (!running) return;

  // smooth player movement
  player.x += (player.tx - player.x) * .14;
  player.y += (player.ty - player.y) * .14;

  // bullets
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.y += b.vy;
    if (!b.alive || b.y < -20) { bullets.splice(i, 1); continue; }

    // collision with meteors
    for (let j = meteors.length - 1; j >= 0; j--) {
      const m = meteors[j];
      if (Math.hypot(b.x - m.x, b.y - m.y) < m.r + 4) {
        b.alive = false;
        m.hp--;
        // small hit sparks
        particles.push(...mkParticles(m.x, m.y, m.rare ? 6 : 3, m.hue, false));
        if (m.hp <= 0) {
          hitMeteor(m, j);
        }
        break;
      }
    }
  }

  // meteors
  for (let i = meteors.length - 1; i >= 0; i--) {
    const m = meteors[i];
    m.age++;
    if (m.pat === 1) m.vx = Math.sin(m.patPh + m.age * .04) * (1.4 + wave * .08);
    if (m.pat === 2) m.vx += Math.cos(m.patPh + m.age * .03) * .07;
    m.vx = Math.max(-4.5, Math.min(4.5, m.vx));
    m.x += m.vx; m.y += m.vy;
    // trail — keep short
    m.trail.push({ x: m.x, y: m.y });
    if (m.trail.length > 14) m.trail.shift();
    // wrap x
    if (m.x < -20) m.x = W + 20;
    if (m.x > W + 20) m.x = -20;
    // hit ground
    if (m.y > gY + m.r) {
      meteors.splice(i, 1);
      takeDamage();
      continue;
    }
  }

  // particles (integer frame counter instead of Date.now())
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.t++;
    p.x += p.vx; p.y += p.vy; p.vy += .06;
    if (p.t >= p.dur) particles.splice(i, 1);
  }

  // rings
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i];
    r.r += 3.2; r.t++;
    if (r.r >= r.maxR) rings.splice(i, 1);
  }

  // wave spawn — more meteors, faster
  waveTimer++;
  const spawnRate = Math.max(18, 44 - wave * 3);
  if (waveTimer % spawnRate === 0 && meteors.length < 10 + wave) {
    meteors.push(mkMeteor());
    // occasionally spawn 2 at once from wave 3+
    if (wave >= 3 && Math.random() < .3) meteors.push(mkMeteor());
  }

  // wave complete
  if (waveKills >= waveTarget) {
    wave++; waveKills = 0; waveTarget = 8 + wave * 2;
    document.getElementById('waveEl').textContent = `wave ${wave}`;
    showLyric(LYRICS[lyricIdx % LYRICS.length]); lyricIdx++;
  }

  if (screenShake > 0.4) screenShake *= .8; else screenShake = 0;
}

function hitMeteor(m, idx) {
  meteors.splice(idx, 1);
  waveKills++;
  const pts = m.rare ? 500 : 10 * (1 + Math.floor(combo / 3));
  score += pts;

  const now = Date.now();
  if (now - lastHit < 1200) combo++; else combo = 1;
  lastHit = now;

  const big = m.rare || combo >= 3;
  particles.push(...mkParticles(m.x, m.y, big ? 18 : 8, m.hue, big));
  rings.push(mkRing(m.x, m.y, m.hue));
  if (big) rings.push(mkRing(m.x, m.y, m.hue + 20));

  if (m.rare) { Snd.rare(); screenShake = 10; openWishModal(); }
  else { Snd.hit(big); if (combo >= 3) { screenShake = 4; showCombo(combo); } }

  updateScore();
}

function takeDamage() {
  hp--;
  screenShake = 7; Snd.dmg();
  document.getElementById('dmgFlash').classList.add('go');
  setTimeout(() => document.getElementById('dmgFlash').classList.remove('go'), 350);
  const pct = Math.max(0, hp / MAX_HP);
  const hf = document.getElementById('hpFill');
  hf.style.width = `${pct * 100}%`;
  hf.style.background = pct < .3 ? 'rgba(255,80,80,.6)' : pct < .6 ? 'rgba(255,180,80,.4)' : 'rgba(232,226,210,.35)';
  if (hp <= 0) endGame();
}

// ─── DRAW (visuals only) ──────────────────────────
function draw(ts) {
  const sx = screenShake > 0 ? rnd(-screenShake, screenShake) : 0;
  const sy = screenShake > 0 ? rnd(-screenShake * .5, screenShake * .5) : 0;

  X.save();
  if (sx || sy) X.translate(sx, sy);

  // sky — static gradient, just fill
  X.fillStyle = '#070a1a';
  X.fillRect(-20, -20, W + 40, H + 40);

  // top gradient
  X.fillStyle = 'rgba(5,6,18,0.6)';
  X.fillRect(-20, -20, W + 40, H * .4);

  // bg stars — simple alpha circles, no gradients
  bgStars.forEach(s => {
    s.ph += s.sp;
    const a = s.base * (.6 + .4 * Math.sin(s.ph));
    X.globalAlpha = a;
    X.fillStyle = '#d8d4ff';
    X.beginPath(); X.arc(s.x, s.y, s.sz, 0, TAU); X.fill();
  });
  X.globalAlpha = 1;

  // ground
  X.fillStyle = '#04060c';
  X.beginPath(); X.moveTo(0, gY);
  for (let x = 0; x <= W; x += 20) {
    X.lineTo(x, gY + Math.sin(x * .04 + ts * .0002) * 3);
  }
  X.lineTo(W, H); X.lineTo(0, H); X.closePath(); X.fill();

  // rings — simple stroke circles, fast
  rings.forEach(r => {
    const al = (1 - r.r / r.maxR) * .5;
    X.globalAlpha = al;
    X.strokeStyle = `hsl(${r.hue},50%,75%)`;
    X.lineWidth = 1.5;
    X.beginPath(); X.arc(r.x, r.y, r.r, 0, TAU); X.stroke();
  });
  X.globalAlpha = 1;

  // particles — simple filled circles
  particles.forEach(p => {
    const al = (1 - p.t / p.dur) * .85;
    X.globalAlpha = al;
    X.fillStyle = `hsl(${p.hue},${p.sat}%,82%)`;
    X.beginPath(); X.arc(p.x, p.y, p.r * (1 - p.t / p.dur * .4), 0, TAU); X.fill();
  });
  X.globalAlpha = 1;

  // bullets — simple rect, fastest possible
  X.fillStyle = 'rgba(210,200,255,.9)';
  bullets.forEach(b => {
    if (!b.alive) return;
    X.fillRect(b.x - 1.5, b.y - 14, 3, 16);
    // tip dot
    X.globalAlpha = .5;
    X.fillRect(b.x - 3, b.y - 16, 6, 4);
    X.globalAlpha = 1;
  });

  // meteors — use pre-rendered sprite, add trail with lines
  meteors.forEach(m => {
    // trail — fading strokes
    if (m.trail.length > 1) {
      for (let t = 1; t < m.trail.length; t++) {
        const al = (t / m.trail.length) * (m.rare ? .5 : .3);
        X.strokeStyle = `hsla(${m.hue},50%,80%,${al})`;
        X.lineWidth = m.rare ? 2.2 : 1.4;
        X.beginPath();
        X.moveTo(m.trail[t-1].x, m.trail[t-1].y);
        X.lineTo(m.trail[t].x, m.trail[t].y);
        X.stroke();
      }
    }

    // sprite with slow rotation
    if (!m.sprite) m.sprite = getStarSprite(m.r, m.hue, m.rare);
    const ss = m.sprite.width;
    X.save();
    X.translate(m.x, m.y);
    X.rotate(m.age * (m.rare ? .04 : .06));
    X.drawImage(m.sprite, -ss/2, -ss/2);
    X.restore();

    // rare: pulse ring only (no gradient)
    if (m.rare) {
      const pulse = .3 + Math.sin(m.age * .08) * .22;
      X.globalAlpha = pulse;
      X.strokeStyle = `hsl(270,40%,88%)`;
      X.lineWidth = 1.2;
      X.beginPath();
      X.arc(m.x, m.y, m.r + 5 + Math.sin(m.age * .1) * 3, 0, TAU);
      X.stroke();
      X.globalAlpha = 1;

      // hp bar
      const bw = 36, bx = m.x - bw / 2, by = m.y - m.r - 13;
      X.fillStyle = 'rgba(255,255,255,.1)';
      X.fillRect(bx, by, bw, 3);
      X.fillStyle = 'rgba(200,180,255,.8)';
      X.fillRect(bx, by, bw * (m.hp / m.maxHp), 3);
    }
  });

  // player — ethereal celestial orb
  if (phase === 'playing') {
    const px = player.x, py = player.y;
    const t = Date.now() * .001; // time for animation

    X.save();
    X.translate(px, py);

    // outer slow-rotating sacred geometry ring
    X.save();
    X.rotate(t * .4);
    X.globalAlpha = .18 + Math.sin(t * 1.2) * .06;
    X.strokeStyle = 'rgba(200,180,255,1)';
    X.lineWidth = .8;
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * TAU;
      const bx = Math.cos(a) * 18, by = Math.sin(a) * 18;
      X.beginPath(); X.arc(bx, by, 2.5, 0, TAU); X.stroke();
      // connecting lines to center
      X.beginPath(); X.moveTo(0, 0); X.lineTo(bx, by); X.stroke();
    }
    X.restore();

    // second ring — counter-rotate
    X.save();
    X.rotate(-t * .65);
    X.globalAlpha = .12 + Math.sin(t * .9) * .05;
    X.strokeStyle = 'rgba(220,200,255,1)';
    X.lineWidth = .6;
    X.beginPath(); X.arc(0, 0, 22, 0, TAU); X.stroke();
    // dashes on ring
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * TAU;
      X.beginPath();
      X.moveTo(Math.cos(a) * 19, Math.sin(a) * 19);
      X.lineTo(Math.cos(a) * 25, Math.sin(a) * 25);
      X.stroke();
    }
    X.restore();

    // 4-point star cross streaks
    X.globalAlpha = .35 + Math.sin(t * 2) * .1;
    [[0, 14], [Math.PI/2, 10]].forEach(([angle, len]) => {
      X.save(); X.rotate(angle);
      const sg = X.createLinearGradient(0, -len, 0, len);
      sg.addColorStop(0, 'rgba(230,215,255,0)');
      sg.addColorStop(.5, 'rgba(230,215,255,.9)');
      sg.addColorStop(1, 'rgba(230,215,255,0)');
      X.fillStyle = sg;
      X.fillRect(-.6, -len, 1.2, len * 2);
      X.restore();
    });

    // core glow — pulsing orb
    const pulse = .88 + Math.sin(t * 3.2) * .12;
    X.globalAlpha = 1;
    const cg = X.createRadialGradient(0, 0, 0, 0, 0, 9 * pulse);
    cg.addColorStop(0, 'rgba(255,252,255,.95)');
    cg.addColorStop(.35, 'rgba(215,200,255,.75)');
    cg.addColorStop(.7, 'rgba(170,150,255,.3)');
    cg.addColorStop(1, 'rgba(130,110,220,0)');
    X.beginPath(); X.arc(0, 0, 9 * pulse, 0, TAU);
    X.fillStyle = cg; X.fill();

    // tiny bright center point
    X.globalAlpha = .95;
    X.fillStyle = 'rgba(255,255,255,.98)';
    X.beginPath(); X.arc(0, 0, 1.8, 0, TAU); X.fill();

    // floating particles orbiting
    for (let i = 0; i < 3; i++) {
      const oa = t * (1.2 + i * .4) + (i / 3) * TAU;
      const or = 11 + i * 3;
      const ox2 = Math.cos(oa) * or, oy2 = Math.sin(oa) * or;
      X.globalAlpha = .45 + Math.sin(t * 2 + i) * .2;
      X.fillStyle = 'rgba(210,195,255,1)';
      X.beginPath(); X.arc(ox2, oy2, 1.2, 0, TAU); X.fill();
    }

    // upward trail particles (engine effect)
    for (let i = 0; i < 4; i++) {
      const tr = rnd(-4, 4);
      const ty2 = rnd(8, 28);
      X.globalAlpha = rnd(.05, .25);
      X.fillStyle = 'rgba(180,160,255,1)';
      X.beginPath(); X.arc(tr, ty2, rnd(.5, 2), 0, TAU); X.fill();
    }

    X.globalAlpha = 1;
    X.restore();
  }

  X.restore();
}

// ─── MAIN LOOP ───────────────────────────────────
function loop(ts) {
  update();
  draw(ts);
  if (running) raf = requestAnimationFrame(loop);
}

// ─── UI ──────────────────────────────────────────
function updateScore() {
  document.getElementById('scoreEl').textContent = `${score.toLocaleString()}  pts`;
}
function showCombo(n) {
  const el = document.getElementById('comboEl');
  el.textContent = n >= 5 ? `${n}× ✦` : `${n}× combo`;
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
}
function showLyric(t) {
  const el = document.getElementById('lyricEl');
  el.textContent = t; el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
}
let _tt = null;
function toast(m) {
  const el = document.getElementById('toast');
  el.textContent = m; el.classList.add('on');
  clearTimeout(_tt); _tt = setTimeout(() => el.classList.remove('on'), 2400);
}
function showScreen(id) {
  document.querySelectorAll('.scr').forEach(s => s.classList.remove('on'));
  document.getElementById(id).classList.add('on');
}

// ─── WISH ────────────────────────────────────────
function openWishModal() {
  running = false;
  document.getElementById('wishInput').value = '';
  document.getElementById('wishModal').classList.add('on');
  setTimeout(() => document.getElementById('wishInput').focus(), 350);
}
function closeWishModal(txt) {
  document.getElementById('wishModal').classList.remove('on');
  document.getElementById('wishInput').blur();
  lastWishText = txt && txt.trim() ? txt.trim() : '';
  if (lastWishText) showLyric(`"${lastWishText}"`);
  Snd.rare();
  running = true;
  raf = requestAnimationFrame(loop);
}

// ─── GAME FLOW ───────────────────────────────────
function startGame() {
  Snd.init();
  bullets = []; meteors = []; particles = []; rings = [];
  hp = MAX_HP; score = 0; combo = 0; lastHit = 0;
  wave = 1; waveTimer = 0; waveKills = 0; waveTarget = 8;
  screenShake = 0; lastWishText = ''; lyricIdx = 0; shooting = false;
  player.x = player.tx = W / 2;
  player.y = player.ty = H * .82;
  const hf = document.getElementById('hpFill');
  hf.style.width = '100%'; hf.style.background = 'rgba(232,226,210,.35)';
  document.getElementById('waveEl').textContent = 'wave 1';
  updateScore();
  running = true; phase = 'playing';
  showScreen('hud');
  const bgm = document.getElementById('bgm');
  bgm.currentTime = 0;
  bgm.volume = 0.15;
  bgm.play().catch(() => {});
  raf = requestAnimationFrame(loop);
}

function endGame() {
  running = false; phase = 'ended'; Snd.fadeOut();
  const bgm = document.getElementById('bgm');
  bgm.pause(); bgm.currentTime = 0;
  meteors = []; bullets = [];
  setTimeout(doShutter, 600);
}

function doShutter() {
  Snd.shutter();
  const fl = document.getElementById('flash');
  fl.classList.add('go'); setTimeout(() => fl.classList.remove('go'), 500);

  requestAnimationFrame(() => setTimeout(() => {

    // ── 캡처 전 신비로운 효과 덧씌우기 ──────────────
    // 1. 전체 어두운 보라빛 오버레이
    X.save();
    X.fillStyle = 'rgba(8,5,28,.38)';
    X.fillRect(0, 0, W, H);

    // 2. 중앙 발광 — 빛이 안에서 퍼지는 느낌
    const cx = W / 2, cy = H / 2;
    const glow = X.createRadialGradient(cx, cy * .7, 0, cx, cy * .7, W * .65);
    glow.addColorStop(0,  'rgba(180,150,255,.18)');
    glow.addColorStop(.5, 'rgba(120,90,200,.08)');
    glow.addColorStop(1,  'rgba(0,0,0,0)');
    X.fillStyle = glow;
    X.fillRect(0, 0, W, H);

    // 3. 흩어진 빛 입자 — 별처럼 보이는 작은 점들
    for (let i = 0; i < 60; i++) {
      const px = rnd(0, W), py = rnd(0, H * .85);
      const pr = rnd(.3, 1.6);
      const pa = rnd(.15, .7);
      const ph = rnd(220, 310);
      X.globalAlpha = pa;
      X.fillStyle = `hsl(${ph},60%,88%)`;
      X.beginPath(); X.arc(px, py, pr, 0, TAU); X.fill();
      // 십자 스트릭
      if (pr > 1.1) {
        X.globalAlpha = pa * .4;
        X.strokeStyle = `hsl(${ph},50%,90%)`;
        X.lineWidth = .5;
        X.beginPath(); X.moveTo(px - pr*3, py); X.lineTo(px + pr*3, py); X.stroke();
        X.beginPath(); X.moveTo(px, py - pr*3); X.lineTo(px, py + pr*3); X.stroke();
      }
    }
    X.globalAlpha = 1;

    // 4. 소원 텍스트가 있으면 하늘에 크게 — 폴라로이드에 찍히게
    if (lastWishText) {
      const fontSize = Math.min(W / 18, 32);
      X.font = `italic ${fontSize}px Georgia,serif`;
      X.textAlign = 'center';
      X.shadowColor = 'rgba(200,170,255,.9)';
      X.shadowBlur = 22;
      X.fillStyle = 'rgba(225,215,255,.72)';
      X.fillText(`"${lastWishText}"`, W/2, H * .28);
      // 양쪽 ✦
      X.font = `${fontSize * .7}px serif`;
      const tw = X.measureText(`"${lastWishText}"`).width;
      X.fillText('✦', W/2 - tw/2 - 18, H * .28);
      X.fillText('✦', W/2 + tw/2 + 18, H * .28);
      X.shadowBlur = 0;
    }

    // 5. 하단 곡선 비네트 — 영화 느낌
    const vg = X.createLinearGradient(0, 0, 0, H);
    vg.addColorStop(0,   'rgba(4,3,16,.45)');
    vg.addColorStop(.15, 'rgba(4,3,16,0)');
    vg.addColorStop(.85, 'rgba(4,3,16,0)');
    vg.addColorStop(1,   'rgba(4,3,16,.55)');
    X.fillStyle = vg;
    X.fillRect(0, 0, W, H);

    // 좌우 비네트
    const lg = X.createLinearGradient(0, 0, W, 0);
    lg.addColorStop(0,   'rgba(4,3,16,.3)');
    lg.addColorStop(.12, 'rgba(4,3,16,0)');
    lg.addColorStop(.88, 'rgba(4,3,16,0)');
    lg.addColorStop(1,   'rgba(4,3,16,.3)');
    X.fillStyle = lg;
    X.fillRect(0, 0, W, H);

    X.restore();
    // ── 효과 끝 ──────────────────────────────────────

    const snap = C.toDataURL('image/jpeg', .92);
    // if paused mid-game, show resume option; else normal end screen
    if (phase === 'paused') showPausedPolaroid(snap);
    else showPolaroid(snap);
  }, 100));
}

// Mid-game: pause + snap
function midGameSnap() {
  if (phase !== 'playing') return;
  running = false;
  clearInterval(ticker);
  shooting = false;
  phase = 'paused';
  Snd.shutter();
  const fl = document.getElementById('flash');
  fl.classList.add('go'); setTimeout(() => fl.classList.remove('go'), 500);
  // draw effects then capture
  requestAnimationFrame(() => setTimeout(() => {
    X.save();
    X.fillStyle = 'rgba(8,5,28,.38)'; X.fillRect(0,0,W,H);
    const glow2 = X.createRadialGradient(W/2,H*.5,0,W/2,H*.5,W*.6);
    glow2.addColorStop(0,'rgba(180,150,255,.16)');glow2.addColorStop(1,'rgba(0,0,0,0)');
    X.fillStyle=glow2; X.fillRect(0,0,W,H);
    for(let i=0;i<50;i++){const px=rnd(0,W),py=rnd(0,H*.85),pr=rnd(.3,1.5),pa=rnd(.1,.6),ph=rnd(220,310);X.globalAlpha=pa;X.fillStyle=`hsl(${ph},60%,88%)`;X.beginPath();X.arc(px,py,pr,0,TAU);X.fill();}
    X.globalAlpha=1;
    if(lastWishText){const fs=Math.min(W/18,30);X.font=`italic ${fs}px Georgia,serif`;X.textAlign='center';X.fillStyle='rgba(220,210,255,.7)';X.shadowColor='rgba(180,150,255,.7)';X.shadowBlur=18;X.fillText(`"${lastWishText}"`,W/2,H*.28);X.shadowBlur=0;}
    const vg2=X.createLinearGradient(0,0,0,H);vg2.addColorStop(0,'rgba(4,3,16,.4)');vg2.addColorStop(.15,'rgba(4,3,16,0)');vg2.addColorStop(.85,'rgba(4,3,16,0)');vg2.addColorStop(1,'rgba(4,3,16,.5)');X.fillStyle=vg2;X.fillRect(0,0,W,H);
    X.restore();
    const snap = C.toDataURL('image/jpeg', .92);
    showPausedPolaroid(snap);
  }, 100));
}

function showPausedPolaroid(snap) {
  const img = document.getElementById('snapImg');
  img.src = snap; img.classList.remove('dev');
  document.getElementById('bmeta').textContent =
    lastWishText ? `✦ "${lastWishText}"` : `${score.toLocaleString()} pts · wave ${wave}`;
  // swap Again → Resume
  const ag = document.getElementById('againBtn');
  ag.textContent = 'Resume'; ag.onclick = resumeGame;
  showScreen('end');
  const pol = document.getElementById('pol'), br = document.getElementById('brow');
  pol.classList.remove('show'); br.classList.remove('show');
  setTimeout(() => {
    pol.classList.add('show');
    setTimeout(() => img.classList.add('dev'), 280);
    setTimeout(() => br.classList.add('show'), 430);
  }, 80);
}

function resumeGame() {
  // restore Again button
  const ag = document.getElementById('againBtn');
  ag.textContent = 'Again'; ag.onclick = restart;
  document.getElementById('pol').classList.remove('show');
  document.getElementById('brow').classList.remove('show');
  document.getElementById('snapImg').classList.remove('dev');
  phase = 'playing'; running = true;
  showScreen('hud');
  // restart countdown
  ticker = setInterval(() => {
    tLeft--; updateStats();
    document.getElementById('tfill') && (document.getElementById('tfill').style.width = `${(tLeft/DURATION)*100}%`);
    if (tLeft <= 0) { clearInterval(ticker); endGame(); }
  }, 1000);
  raf = requestAnimationFrame(loop);
}

function showPolaroid(snap) {
  const img = document.getElementById('snapImg');
  img.src = snap; img.classList.remove('dev');
  document.getElementById('bmeta').textContent =
    lastWishText ? `✦ "${lastWishText}"` : `${score.toLocaleString()} pts · wave ${wave}`;
  showScreen('end');
  const pol = document.getElementById('pol'), br = document.getElementById('brow');
  pol.classList.remove('show'); br.classList.remove('show');
  setTimeout(() => {
    pol.classList.add('show');
    setTimeout(() => img.classList.add('dev'), 280);
    setTimeout(() => br.classList.add('show'), 430);
  }, 80);
}

// ─── INSTAGRAM ───────────────────────────────────
async function shareToInstagramStory() {
  const gameSnap = document.getElementById('snapImg').src;
  if (!gameSnap) { toast('play first!'); return; }
  const SW = 1080, SH = 1920;
  const sc = document.createElement('canvas'); sc.width = SW; sc.height = SH;
  const ctx = sc.getContext('2d');
  ctx.fillStyle = '#050818'; ctx.fillRect(0, 0, SW, SH);
  for (let i = 0; i < 200; i++) {
    const sx = Math.random()*SW, sy = Math.random()*SH*.75, sr = Math.random()*1.8, sa = Math.random()*.8+.1;
    ctx.globalAlpha = sa; ctx.fillStyle = '#d8d4ff';
    ctx.beginPath(); ctx.arc(sx, sy, sr, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  const gi = new Image();
  await new Promise(r => { gi.onload = r; gi.src = gameSnap; });
  const PW = 780, PH = 680, PX = (SW-PW)/2, PY = 380;
  ctx.fillStyle = '#f0ead8'; ctx.fillRect(PX, PY, PW, PH+180);
  ctx.drawImage(gi, PX+24, PY+24, PW-48, PH-24);
  ctx.fillStyle = '#ede8df'; ctx.fillRect(PX, PY+PH, PW, 180);
  ctx.fillStyle = '#d8d2c8'; ctx.fillRect(PX+24, PY+PH, PW-48, 1);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#1a1510'; ctx.font = `italic 52px Georgia,serif`; ctx.fillText('Falling for You', SW/2, PY+PH+72);
  ctx.fillStyle = '#888'; ctx.font = `26px 'Courier New',monospace`; ctx.fillText('IAN CHUNG  ×  MARTELLO', SW/2, PY+PH+118);
  if (lastWishText) {
    ctx.font = `italic 56px Georgia,serif`; ctx.fillStyle = 'rgba(220,210,255,.9)';
    ctx.shadowColor = 'rgba(180,150,255,.8)'; ctx.shadowBlur = 28;
    ctx.fillText(`"${lastWishText}"`, SW/2, PY-80); ctx.shadowBlur = 0;
    ctx.font = `34px serif`; ctx.fillStyle = 'rgba(220,210,255,.6)';
    const tw = ctx.measureText(`"${lastWishText}"`).width;
    ctx.fillText('✦', SW/2-tw/2-38, PY-80); ctx.fillText('✦', SW/2+tw/2+38, PY-80);
  }
  ctx.font = `20px 'Courier New',monospace`; ctx.fillStyle = 'rgba(200,190,255,.28)'; ctx.fillText('@ianc.hung', SW/2, SH-58);
  sc.toBlob(async blob => {
    if (!blob) return;
    const file = new File([blob], 'falling_for_you_story.jpg', {type:'image/jpeg'});
    if (navigator.share && navigator.canShare && navigator.canShare({files:[file]})) {
      try { await navigator.share({files:[file], title:'Falling for You'}); showIgOverlay(); return; }
      catch(e) { if (e.name === 'AbortError') return; }
    }
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = 'falling_for_you_story.jpg'; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    showIgOverlay();
  }, 'image/jpeg', .95);
}

function showIgOverlay() {
  const ex = document.getElementById('igOverlay'); if (ex) ex.remove();
  const ov = document.createElement('div'); ov.id = 'igOverlay';
  ov.style.cssText = `position:fixed;inset:0;z-index:80;background:rgba(3,4,14,.88);display:flex;align-items:center;justify-content:center;font-family:'Courier New',monospace`;
  ov.innerHTML = `<style>@keyframes fi{from{opacity:0}to{opacity:1}}#igB{animation:fi .4s ease;display:flex;flex-direction:column;align-items:center;gap:16px;max-width:min(300px,84vw);text-align:center}#igT{font-family:Georgia,serif;font-style:italic;font-size:16px;color:rgba(232,226,210,.88);line-height:1.6}#igS{font-size:9px;color:rgba(200,180,255,.38);letter-spacing:.18em;text-transform:uppercase;line-height:1.8}#igO{background:linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045);border:none;color:#fff;padding:14px 0;letter-spacing:.2em;font-size:11px;font-family:'Courier New',monospace;cursor:pointer;text-transform:uppercase;width:100%;min-height:50px}#igD{background:transparent;border:1px solid rgba(232,226,210,.18);color:rgba(232,226,210,.36);padding:11px 0;letter-spacing:.2em;font-size:10px;font-family:'Courier New',monospace;cursor:pointer;text-transform:uppercase;width:100%;min-height:44px}</style>
  <div id="igB"><div style="font-size:36px">✦</div><div id="igT">공유 시트에서<br>"이미지 저장" 탭 → 사진 앱에 저장</div><div id="igS">그 다음 인스타그램 → 스토리 추가<br>갤러리에서 이미지 선택</div><button id="igO">Open Instagram</button><button id="igD">Done</button></div>`;
  document.body.appendChild(ov);
  document.getElementById('igO').onclick = () => {
    window.location.href = 'instagram://story-camera';
    setTimeout(() => {
      if (/iphone|ipad|ipod/i.test(navigator.userAgent)) window.location.href = 'https://apps.apple.com/app/instagram/id389801252';
      else window.open('https://play.google.com/store/apps/details?id=com.instagram.android', '_blank');
    }, 1500);
  };
  document.getElementById('igD').onclick = () => ov.remove();
}

function doSave() {
  const snap = document.getElementById('snapImg').src; if (!snap) return;

  // Polaroid dimensions
  const PW = 640, PH = 760;
  const PAD = 22;           // side padding
  const PHOTO_W = PW - PAD*2;  // 596
  const PHOTO_H = 536;         // photo area height
  const BOTTOM_H = PH - PHOTO_H - PAD;  // bottom text strip

  const pc = document.createElement('canvas');
  pc.width = PW; pc.height = PH;
  const ct = pc.getContext('2d');

  // Polaroid background
  ct.fillStyle = '#f2ede4'; ct.fillRect(0, 0, PW, PH);

  const img = new Image();
  img.onload = () => {
    // Cover-fit: fill the photo area without distortion
    const iw = img.naturalWidth, ih = img.naturalHeight;
    const scale = Math.max(PHOTO_W / iw, PHOTO_H / ih);
    const dw = iw * scale, dh = ih * scale;
    const dx = PAD + (PHOTO_W - dw) / 2;
    const dy = PAD + (PHOTO_H - dh) / 2;

    // Clip to photo area then draw
    ct.save();
    ct.beginPath();
    ct.rect(PAD, PAD, PHOTO_W, PHOTO_H);
    ct.clip();
    ct.drawImage(img, dx, dy, dw, dh);
    ct.restore();

    // Bottom strip
    const stripY = PAD + PHOTO_H;
    ct.fillStyle = '#ede8df'; ct.fillRect(0, stripY, PW, BOTTOM_H);
    ct.fillStyle = '#d8d2c8'; ct.fillRect(PAD, stripY, PHOTO_W, 1);

    // Text
    ct.textAlign = 'center';
    ct.fillStyle = '#1a1510';
    ct.font = 'italic 26px Georgia,serif';
    ct.fillText('Falling for You', PW/2, stripY + 52);

    ct.fillStyle = '#888';
    ct.font = "13px 'Courier New',monospace";
    ct.fillText('IAN CHUNG  ×  MARTELLO', PW/2, stripY + 82);

    ct.fillStyle = '#bbb';
    ct.font = "11px 'Courier New',monospace";
    const meta = lastWishText
      ? `✦ "${lastWishText}"`
      : `${score.toLocaleString()} pts · wave ${wave}`;
    ct.fillText(meta.length > 42 ? meta.slice(0,42)+'…' : meta, PW/2, stripY + 100);

    ct.fillStyle = '#c0b0a0';
    ct.font = "10px 'Courier New',monospace";
    ct.letterSpacing = '0.12em';
    ct.fillText('OUT ON JUNE 5, 2026', PW/2, stripY + 122);

    pc.toBlob(blob => {
      const file = new File([blob], 'falling_for_you.jpg', {type:'image/jpeg'});
      if (navigator.share && navigator.canShare && navigator.canShare({files:[file]})) {
        navigator.share({files:[file]});
      } else {
        const url = URL.createObjectURL(blob), a = document.createElement('a');
        a.href = url; a.download = 'falling_for_you.jpg'; a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }
    }, 'image/jpeg', .95);
  };
  img.src = snap;
}

function restart() {
  document.getElementById('pol').classList.remove('show');
  document.getElementById('brow').classList.remove('show');
  document.getElementById('snapImg').classList.remove('dev');
  const bgm = document.getElementById('bgm');
  bgm.pause(); bgm.currentTime = 0;
  phase = 'intro'; showScreen('intro');
  bullets=[]; meteors=[]; particles=[]; rings=[]; running=false;
}

// ─── EVENTS ──────────────────────────────────────
let lastT = 0;
function bindBtn(id, fn) {
  const el = document.getElementById(id); if (!el) return;
  el.addEventListener('touchend', e => { e.preventDefault(); e.stopPropagation(); lastT = Date.now(); fn(); }, {passive:false});
  el.addEventListener('click', e => { if (Date.now()-lastT < 400) return; fn(); });
}
bindBtn('beginBtn', startGame);
bindBtn('snapBtn', midGameSnap);
bindBtn('saveBtn', doSave);
bindBtn('igBtn', shareToInstagramStory);
bindBtn('againBtn', restart);
bindBtn('wishSendBtn', () => closeWishModal(document.getElementById('wishInput').value));
document.getElementById('wishInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); closeWishModal(e.target.value); }
});

// ── CONTROLS ─────────────────────────────────────
// PC: mousemove = aim, mousedown/up = shoot
// Mobile: touchmove = aim + auto-fire, finger down = shooting

// PC mouse
window.addEventListener('mousemove', e => {
  if (phase !== 'playing') return;
  player.tx = e.clientX;
  player.ty = Math.max(H * .45, Math.min(H * .93, e.clientY));
});
window.addEventListener('mousedown', e => {
  if (phase !== 'playing') return;
  if (e.target.tagName === 'BUTTON' || e.target.id === 'wishInput') return;
  shooting = true; tryShoot();
});
window.addEventListener('mouseup', () => { shooting = false; });

// Mobile touch — single handler does everything
// touchstart: begin moving + shooting
// touchmove:  keep moving + keep shooting
// touchend:   stop shooting
function handleTouch(e) {
  if (phase !== 'playing') return;
  if (e.target.tagName === 'BUTTON' || e.target.id === 'wishInput') return;
  const t = e.touches[0];
  if (!t) return;
  player.tx = t.clientX;
  player.ty = Math.max(H * .45, Math.min(H * .93, t.clientY));
}

document.addEventListener('touchstart', e => {
  if (phase !== 'playing') return;
  if (e.target.tagName === 'BUTTON' || e.target.id === 'wishInput') return;
  lastT = Date.now();
  shooting = true;
  handleTouch(e);
  tryShoot();
}, { passive: true });

document.addEventListener('touchmove', e => {
  if (phase !== 'playing') return;
  handleTouch(e);
}, { passive: true }); // passive:true = no preventDefault, smooth scroll not blocked

document.addEventListener('touchend', e => {
  if (e.target.tagName === 'BUTTON' || e.target.id === 'wishInput') return;
  shooting = false;
});

// auto-fire while finger held down
setInterval(() => { if (shooting && phase === 'playing') tryShoot(); }, SHOOT_CD);

window.addEventListener('resize', resize);
resize();
raf = requestAnimationFrame(loop);
</script>
