<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Falling for You</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#050818;font-family:'Courier New',monospace}
#c{position:fixed;top:0;left:0;touch-action:none}
.ov{position:fixed;inset:0;pointer-events:none}
.vign{background:radial-gradient(ellipse at 50% 60%,transparent 30%,rgba(3,4,14,.75)100%)}
.grain{opacity:.045;mix-blend-mode:overlay;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.4'/%3E%3C/svg%3E");background-size:200px 200px}
.scr{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#e8e2d4;opacity:0;transition:opacity .6s ease;pointer-events:none}
.scr.on{opacity:1;pointer-events:all}
#hud.on{pointer-events:none!important}
#intro .badge{letter-spacing:.35em;font-size:9px;opacity:.35;margin-bottom:10px;text-transform:uppercase}
#intro h1{font-family:Georgia,serif;font-size:clamp(32px,7vw,56px);font-weight:300;letter-spacing:.05em;margin:0 0 6px;text-align:center;line-height:1.1}
#intro .sub{font-size:10px;opacity:.25;margin-bottom:48px;letter-spacing:.28em;text-align:center}
#intro .hint{position:absolute;bottom:28px;font-size:9px;opacity:.18;letter-spacing:.14em;animation:pulse 3s ease infinite;text-align:center;padding:0 20px}
.gbtn{background:transparent;border:1px solid rgba(232,226,210,.3);color:rgba(232,226,210,.7);padding:14px 48px;letter-spacing:.28em;font-size:11px;font-family:'Courier New',monospace;cursor:pointer;text-transform:uppercase;-webkit-appearance:none;border-radius:0;min-width:160px;min-height:50px}
.gbtn:active{border-color:rgba(232,226,210,.8);color:#e8e2d4}
#scoreEl{position:fixed;top:18px;left:0;right:0;text-align:center;font-size:11px;opacity:.3;letter-spacing:.18em}
#waveEl{position:fixed;top:18px;right:18px;font-size:10px;opacity:.28;letter-spacing:.1em}
#comboEl{position:fixed;top:40px;left:0;right:0;text-align:center;font-family:Georgia,serif;font-style:italic;font-size:clamp(20px,5vw,36px);color:rgba(232,226,210,0);text-shadow:0 0 30px rgba(200,180,255,.8);pointer-events:none}
#comboEl.show{animation:comboPop .8s ease forwards}
#lyricEl{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);font-family:Georgia,serif;font-style:italic;font-size:clamp(15px,4vw,26px);color:rgba(255,240,210,0);text-align:center;text-shadow:0 0 40px rgba(200,180,255,.9);padding:0 24px;max-width:90vw;pointer-events:none}
#lyricEl.show{animation:lyricFloat 2.8s ease forwards}
#hpBar{position:fixed;bottom:0;left:0;right:0;height:3px;background:rgba(232,226,210,.07)}
#hpFill{height:100%;background:rgba(232,226,210,.35);transition:width .3s ease;width:100%}
#energyBar{position:fixed;bottom:3px;left:0;right:0;height:2px;background:rgba(200,180,255,.07)}
#energyFill{height:100%;width:0%;background:rgba(200,170,255,.55);transition:width .3s ease}

#wishModal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(3,4,14,.85);opacity:0;pointer-events:none;transition:opacity .4s ease}
#wishModal.on{opacity:1;pointer-events:all}
.wishBox{background:rgba(6,8,22,.96);border:1px solid rgba(200,180,255,.15);padding:38px 26px 30px;max-width:min(330px,86vw);width:100%;display:flex;flex-direction:column;align-items:center;gap:18px;transform:translateY(14px);transition:transform .4s cubic-bezier(.16,1,.3,1)}
#wishModal.on .wishBox{transform:translateY(0)}
.wishStar{font-size:26px;animation:wishSpin 5s linear infinite}
@keyframes wishSpin{from{filter:hue-rotate(0)}to{filter:hue-rotate(360deg)}}
.wishLabel{font-family:Georgia,serif;font-style:italic;font-size:14px;color:rgba(220,210,255,.82);text-align:center;line-height:1.65}
.wishLabel span{font-size:9px;display:block;font-style:normal;color:rgba(200,190,255,.3);letter-spacing:.22em;margin-top:6px;font-family:‘Courier New’,monospace;text-transform:uppercase}
#wishInput{width:100%;background:transparent;border:none;border-bottom:1px solid rgba(200,180,255,.22);color:#e8e2d4;font-family:Georgia,serif;font-style:italic;font-size:18px;padding:10px 4px;text-align:center;outline:none;-webkit-user-select:text!important;user-select:text!important;caret-color:rgba(200,180,255,.6)}
#wishInput::placeholder{color:rgba(200,180,255,.2);font-style:italic}
.wishSend{background:transparent;border:1px solid rgba(200,180,255,.22);color:rgba(200,180,255,.62);padding:12px 32px;letter-spacing:.22em;font-size:10px;font-family:‘Courier New’,monospace;cursor:pointer;text-transform:uppercase;-webkit-appearance:none;border-radius:0;min-height:46px}
.wishSend:active{border-color:rgba(200,180,255,.7);color:rgba(220,210,255,.95)}

#end{background:rgba(3,4,14,.9)}
.pol{background:#f0ead8;padding:13px 13px 50px;box-shadow:0 28px 72px rgba(0,0,0,.72);max-width:min(288px,78vw);width:100%;transform:translateY(20px);opacity:0;transition:transform .6s cubic-bezier(.16,1,.3,1),opacity .6s ease}
.pol.show{transform:translateY(0);opacity:1}
.pol img{width:100%;display:block;filter:brightness(3.5)saturate(0)blur(8px);transition:filter 1.3s .35s ease}
.pol img.dev{filter:brightness(1)saturate(1)blur(0)}
.ptxt{text-align:center;padding-top:10px}
.ptxt .ti{font-family:Georgia,serif;font-style:italic;font-size:16px;color:#1a1510;margin:0 0 4px}
.ptxt .ar{font-size:8px;color:#9a907e;letter-spacing:.14em;text-transform:uppercase;margin:0 0 3px}
.ptxt .me{font-size:8px;color:#c0b8a8;letter-spacing:.05em;max-width:220px;display:block;margin:0 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptxt .dt{font-size:8px;color:#b0a898;letter-spacing:.18em;text-transform:uppercase;margin-top:5px}
.brow{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;justify-content:center;transform:translateY(12px);opacity:0;transition:transform .5s cubic-bezier(.16,1,.3,1) .4s,opacity .5s .4s}
.brow.show{transform:translateY(0);opacity:1}
.btn{background:transparent;border:1px solid rgba(232,226,210,.28);color:rgba(232,226,210,.55);padding:12px 22px;letter-spacing:.16em;font-size:10px;font-family:‘Courier New’,monospace;cursor:pointer;text-transform:uppercase;-webkit-appearance:none;border-radius:0;min-height:46px}
.btn.ig{background:linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045);border:none;color:#fff;box-shadow:0 4px 20px rgba(253,29,29,.28)}
.btn:active{opacity:.75}

#flash{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:20}
#flash.go{animation:flashAnim .5s ease-out forwards}
#dmgFlash{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:18;background:rgba(255,60,60,.15)}
#dmgFlash.go{animation:dmgAnim .35s ease-out forwards}
#toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:rgba(200,180,255,.1);border:1px solid rgba(200,180,255,.18);color:rgba(220,210,255,.7);padding:8px 18px;font-size:9px;letter-spacing:.13em;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
#snapBtn:active{background:rgba(180,150,255,.18)!important;border-color:rgba(200,180,255,.55)!important;color:rgba(220,200,255,.9)!important;transform:scale(.92)}

@keyframes pulse{0%,100%{opacity:.2}50%{opacity:.36}}
@keyframes comboPop{0%{opacity:0;transform:scale(.7)}25%{opacity:.9;transform:scale(1.08)}60%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(.95)}}
@keyframes lyricFloat{0%{opacity:0;transform:translate(-50%,-45%)}20%{opacity:1;transform:translate(-50%,-50%)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-64%)}}
@keyframes flashAnim{0%{opacity:1;background:rgba(230,220,255,.22)}100%{opacity:0}}
@keyframes dmgAnim{0%{opacity:1}100%{opacity:0}}
</style>

</head>
<body>
<audio id="bgm" src="Falling_for_You.mp3" loop preload="auto"></audio>
<canvas id="c"></canvas>
<div class="ov grain"></div>
<div class="ov vign"></div>
<div id="flash"></div>
<div id="dmgFlash"></div>

<div id="intro" class="scr on">
  <h1>Falling<br>for You</h1>
  <p style="font-size:11px;color:rgba(232,226,210,.62);letter-spacing:.28em;text-transform:uppercase;margin-bottom:48px;font-family:Georgia,serif;font-style:italic;font-weight:300">Ian Chung &nbsp;×&nbsp; Martello</p>
  <button id="beginBtn" class="gbtn">Begin</button>
  <p class="hint">drag to move · hold to shoot · ✦ rare star grants a wish</p>
</div>

<div id="hud" class="scr">
  <div id="scoreEl">0  pts</div>
  <div id="waveEl">wave 1</div>
  <div id="comboEl"></div>
  <div id="lyricEl"></div>
  <div id="hpBar"><div id="hpFill"></div></div>
  <div id="energyBar"><div id="energyFill"></div></div>
</div>

<button id="snapBtn" style="position:fixed;top:28px;right:18px;background:rgba(6,5,20,.65);border:1px solid rgba(200,180,255,.2);color:rgba(185,165,255,.6);width:44px;height:44px;border-radius:10px;cursor:pointer;display:none;align-items:center;justify-content:center;-webkit-appearance:none;z-index:200;transition:all .2s;box-shadow:0 0 12px rgba(160,130,255,.08)">
  <svg width="22" height="18" viewBox="0 0 22 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="1" y="4" width="20" height="13" rx="2"/>
    <circle cx="11" cy="11" r="3.5"/>
    <path d="M7 4 L8.5 1.5 L13.5 1.5 L15 4"/>
    <circle cx="11" cy="11" r="1.5" stroke-opacity=".4"/>
    <circle cx="17.5" cy="7.5" r=".8" fill="currentColor" stroke="none" opacity=".5"/>
  </svg>
</button>

<div id="wishModal">
  <div class="wishBox">
    <div class="wishStar">✦</div>
    <div class="wishLabel">you caught the rarest star<span>make a wish</span></div>
    <input id="wishInput" type="text" maxlength="40" placeholder="write your wish..." autocomplete="off" autocorrect="off" spellcheck="false">
    <button id="wishSendBtn" class="wishSend">Send it to the stars</button>
  </div>
</div>

<div id="end" class="scr">
  <div class="pol" id="pol">
    <img id="snapImg" src="" alt="">
    <div class="ptxt">
      <p class="ti">Falling for You</p>
      <p class="ar">Ian Chung x Martello</p>
      <p class="me" id="bmeta"></p>
      <p class="dt">Out on June 5, 2026</p>
    </div>
  </div>
  <div class="brow" id="brow">
    <button id="igBtn" class="btn ig">Story</button>
    <button id="saveBtn" class="btn">Save</button>
    <button id="againBtn" class="btn">Again</button>
  </div>
</div>
<div id="toast"></div>

<script>
var TAU = Math.PI * 2;
var rnd = function(a,b){return a+Math.random()*(b-a);};
var C = document.getElementById('c');
var X = C.getContext('2d');
var W, H, gY;

// sprite cache
var starCache = {};
function getStarSprite(r, hue, rare) {
  var key = Math.round(r)+'_'+hue+'_'+rare;
  if (starCache[key]) return starCache[key];
  var size = Math.ceil(r * 10);
  var oc = document.createElement('canvas');
  oc.width = oc.height = size * 2;
  var ox = oc.getContext('2d');
  var cx = size, cy = size;
  var gl = ox.createRadialGradient(cx,cy,0,cx,cy,size);
  gl.addColorStop(0,'hsla('+hue+','+(rare?15:50)+'%,'+(rare?99:85)+'%,'+(rare?.55:.38)+')');
  gl.addColorStop(.5,'hsla('+hue+','+(rare?15:50)+'%,'+(rare?99:85)+'%,.08)');
  gl.addColorStop(1,'rgba(0,0,0,0)');
  ox.beginPath(); ox.arc(cx,cy,size,0,TAU); ox.fillStyle=gl; ox.fill();
  var pts = rare ? 6 : 4;
  var outer = r, inner = r*(rare?.22:.18);
  ox.save(); ox.translate(cx,cy);
  ox.beginPath();
  for (var i=0;i<pts*2;i++) {
    var a = (i/(pts*2))*TAU - TAU/4;
    var rad = i%2===0 ? outer : inner;
    if(i===0) ox.moveTo(Math.cos(a)*rad,Math.sin(a)*rad);
    else ox.lineTo(Math.cos(a)*rad,Math.sin(a)*rad);
  }
  ox.closePath();
  ox.fillStyle='hsla('+hue+','+(rare?10:45)+'%,'+(rare?99:90)+'%,.95)';
  ox.fill();
  var sLen = rare ? r*2.8 : r*2.2;
  var sW = rare ? 1.4 : .9;
  [[0,sLen],[TAU/4,sLen*.7]].forEach(function(p){
    ox.save(); ox.rotate(p[0]);
    var sg = ox.createLinearGradient(0,-p[1],0,p[1]);
    sg.addColorStop(0,'rgba(255,255,255,0)');
    sg.addColorStop(.5,'hsla('+hue+',20%,98%,'+(rare?.8:.65)+')');
    sg.addColorStop(1,'rgba(255,255,255,0)');
    ox.fillStyle=sg; ox.fillRect(-sW/2,-p[1],sW,p[1]*2);
    ox.restore();
  });
  ox.beginPath(); ox.arc(0,0,r*.18,0,TAU);
  ox.fillStyle=rare?'rgba(255,245,255,.98)':'rgba(240,235,255,.95)'; ox.fill();
  ox.restore();
  starCache[key] = oc;
  return oc;
}

// AUDIO
var Snd = {
  ac:null, rev:null, mst:null,
  init:function(){
    try{
      this.ac=new(window.AudioContext||window.webkitAudioContext)();
      if(this.ac.state==='suspended')this.ac.resume();
      this.mst=this.ac.createGain(); this.mst.gain.value=0;
      this.mst.connect(this.ac.destination);
      this.rev=this._rv(5);
      var rg=this.ac.createGain(); rg.gain.value=.76;
      this.rev.connect(rg); rg.connect(this.mst);
      var dg=this.ac.createGain(); dg.gain.value=.24;
      dg.connect(this.mst); this._pads(dg);
      this.mst.gain.setTargetAtTime(.7,this.ac.currentTime,3);
    }catch(e){}
  },
  _rv:function(d){
    var c=this.ac,cv=c.createConvolver();
    var n=c.sampleRate*d,b=c.createBuffer(2,n,c.sampleRate);
    for(var ch=0;ch<2;ch++){var dat=b.getChannelData(ch);for(var i=0;i<n;i++)dat[i]=(Math.random()*2-1)*Math.pow(1-i/n,1.4);}
    cv.buffer=b; return cv;
  },
  _pads:function(dry){
    var self=this;
    [110,164.81,220,261.63].forEach(function(f,i){
      var o=self.ac.createOscillator(),g=self.ac.createGain();
      o.type='sine'; o.frequency.value=f; g.gain.value=.005/(i*.5+1);
      var lfo=self.ac.createOscillator(),lg=self.ac.createGain();
      lfo.frequency.value=.04+i*.016; lg.gain.value=.003;
      lfo.connect(lg); lg.connect(g.gain); lfo.start();
      o.connect(g); g.connect(self.rev); g.connect(dry); o.start();
    });
  },
  _sh:function(f,v,d,dur){
    if(!this.ac)return;
    var t=this.ac.currentTime+d;
    var o=this.ac.createOscillator(),g=this.ac.createGain();
    o.type='sine'; o.frequency.value=f;
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(v,t+dur*.25);
    g.gain.setTargetAtTime(0,t+dur*.3,dur*.35);
    o.connect(g); g.connect(this.rev); g.connect(this.mst);
    o.start(t); o.stop(t+dur+.5);
  },
  shoot:function(){this._sh(1600,.12,0,.07);},
  hit:function(big){
    var self=this;
    if(big){[1,1.26,1.5,1.78].forEach(function(r,i){self._sh(330*r,.18,i*.06,2);});}
    else{this._sh([523,659,784,880][Math.floor(Math.random()*4)],.15,0,1.4);}
  },
  dmg:function(){
    if(!this.ac)return;
    var o=this.ac.createOscillator(),g=this.ac.createGain();
    o.type='sawtooth'; o.frequency.value=110;
    o.frequency.exponentialRampToValueAtTime(55,this.ac.currentTime+.15);
    g.gain.setValueAtTime(.18,this.ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,this.ac.currentTime+.2);
    o.connect(g); g.connect(this.mst); o.start(); o.stop(this.ac.currentTime+.22);
  },
  rare:function(){
    var self=this;
    [1,1.12,1.26,1.50,1.68,2].forEach(function(r,i){self._sh(261.63*r,.045,i*.15,5);});
  },
  shutter:function(){
    if(!this.ac)return;
    var buf=this.ac.createBuffer(1,this.ac.sampleRate*.6,this.ac.sampleRate);
    var dat=buf.getChannelData(0);
    for(var i=0;i<dat.length;i++)dat[i]=(Math.random()*2-1)*.3;
    var src=this.ac.createBufferSource(),g=this.ac.createGain(),f=this.ac.createBiquadFilter();
    src.buffer=buf; f.type='highpass'; f.frequency.value=4000;
    g.gain.setValueAtTime(.055,this.ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,this.ac.currentTime+.6);
    src.connect(f); f.connect(g); g.connect(this.rev); g.connect(this.mst);
    src.start(); src.stop(this.ac.currentTime+.65);
  },
  fadeOut:function(){if(this.mst)this.mst.gain.setTargetAtTime(0,this.ac.currentTime,1.8);}
};

// CONFIG
var MAX_HP=5, SHOOT_CD=130, MAX_ENERGY=3;
var LYRICS=["falling for you","for real, for real","too good to be real","don't wake me up","better than dreams","right here","found my way"];
var METEOR_HUES={common:260,cool:200,warm:340,rare:270};
var POWER_ITEMS=[
  {label:'Falling for You',energy:3,hue:310},
  {label:'Ian Chung',energy:1,hue:190},
  {label:'Martello',energy:1,hue:50}
];

// STATE
var phase='intro';
var player={x:0,y:0,tx:0,ty:0};
var bullets=[],meteors=[],particles=[],rings=[],bgStars=[],powerItems=[];
var hp=MAX_HP,score=0,combo=0,lastHit=0,energy=0;
var wave=1,waveTimer=0,waveKills=0,waveTarget=8;
var shooting=false,lastShot=0,ticker=null;
var running=false,raf=null;
var lastWishText='',lyricIdx=0,screenShake=0;

function resize(){
  W=C.width=window.innerWidth; H=C.height=window.innerHeight; gY=H*.8;
  player.x=player.tx=W/2; player.y=player.ty=H*.82;
  bgStars=[];
  for(var i=0;i<120;i++) bgStars.push({x:rnd(0,W),y:rnd(0,H*.85),sz:rnd(.2,1.4),base:rnd(.1,.75),ph:rnd(0,TAU),sp:rnd(.005,.02)});
}

// FACTORIES
function mkMeteor(){
  var rare=Math.random()<.04;
  var types=['common','cool','warm'];
  var type=rare?'rare':types[Math.floor(Math.random()*3)];
  var pat=Math.floor(rnd(0,3));
  return{type:type,x:rnd(W*.08,W*.92),y:-30,
    vx:rnd(-.5,.5)*(1+wave*.07),vy:rnd(.5,1.0)+wave*.04,
    hp:rare?5:1,maxHp:rare?5:1,r:rare?16:rnd(8,13),
    rare:rare,hue:METEOR_HUES[type],pat:pat,patPh:rnd(0,TAU),age:0,trail:[],sprite:null};
}
function mkBullet(x,y){return{x:x,y:y,vy:-15,alive:true};}
function mkParticles(x,y,n,hue,big){
  var arr=[];
  for(var i=0;i<n;i++){
    var a=rnd(0,TAU),sp=rnd(big?1.5:.8,big?6:3.5);
    arr.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-.5,t:0,dur:rnd(18,big?40:28),r:rnd(.8,big?3.5:2),hue:hue,sat:rnd(30,55)});
  }
  return arr;
}
function mkRing(x,y,hue){return{x:x,y:y,r:0,maxR:rnd(28,52),hue:hue};}
function mkPowerItem(idx){
  var cfg=POWER_ITEMS[idx];
  return{x:rnd(W*.1,W*.9),y:-40,vy:rnd(.5,.9),vx:rnd(-.3,.3),label:cfg.label,energy:cfg.energy,hue:cfg.hue,ph:rnd(0,TAU),r:22,age:0};
}

// SHOOT
function tryShoot(){
  if(phase!=='playing')return;
  var now=Date.now();
  if(now-lastShot<SHOOT_CD)return;
  lastShot=now;
  bullets.push(mkBullet(player.x,player.y-18));
  Snd.shoot();
}

// UPDATE
function update(){
  if(!running)return;
  player.x+=(player.tx-player.x)*.14;
  player.y+=(player.ty-player.y)*.14;

  for(var i=bullets.length-1;i>=0;i--){
    var b=bullets[i];
    b.y+=b.vy;
    if(!b.alive||b.y<-20){bullets.splice(i,1);continue;}
    for(var j=meteors.length-1;j>=0;j--){
      var m=meteors[j];
      if(Math.hypot(b.x-m.x,b.y-m.y)<m.r+4){
        b.alive=false;
        m.hp--;
        particles.push.apply(particles,mkParticles(m.x,m.y,m.rare?6:3,m.hue,false));
        if(m.hp<=0){hitMeteor(m,j);}
        break;
      }
    }
  }

  for(var i=meteors.length-1;i>=0;i--){
    var m=meteors[i];
    m.age++;
    if(m.pat===1)m.vx=Math.sin(m.patPh+m.age*.04)*(1.4+wave*.08);
    if(m.pat===2)m.vx+=Math.cos(m.patPh+m.age*.03)*.07;
    m.vx=Math.max(-4.5,Math.min(4.5,m.vx));
    m.x+=m.vx; m.y+=m.vy;
    m.trail.push({x:m.x,y:m.y});
    if(m.trail.length>14)m.trail.shift();
    if(m.x<-20)m.x=W+20;
    if(m.x>W+20)m.x=-20;
    if(m.y>gY+m.r){meteors.splice(i,1);takeDamage();continue;}
  }

  for(var i=particles.length-1;i>=0;i--){
    var p=particles[i];
    p.t++; p.x+=p.vx; p.y+=p.vy; p.vy+=.06;
    if(p.t>=p.dur)particles.splice(i,1);
  }
  for(var i=rings.length-1;i>=0;i--){
    rings[i].r+=3.2;
    if(rings[i].r>=rings[i].maxR)rings.splice(i,1);
  }

  // power items
  waveTimer++;
  if(waveTimer%380===0){
    powerItems.push(mkPowerItem(Math.floor(Math.random()*POWER_ITEMS.length)));
  }
  for(var i=powerItems.length-1;i>=0;i--){
    var p=powerItems[i];
    p.age++; p.ph+=.04; p.x+=p.vx; p.y+=p.vy;
    if(p.y>H+50){powerItems.splice(i,1);continue;}
    var caught=false;
    for(var j=bullets.length-1;j>=0;j--){
      if(!bullets[j].alive)continue;
      if(Math.hypot(bullets[j].x-p.x,bullets[j].y-p.y)<p.r+6){
        bullets[j].alive=false; caught=true; break;
      }
    }
    if(caught){catchPowerItem(p);powerItems.splice(i,1);}
  }

  // wave spawn
  var spawnRate=Math.max(18,44-wave*3);
  if(waveTimer%spawnRate===0&&meteors.length<10+wave){
    meteors.push(mkMeteor());
    if(wave>=3&&Math.random()<.3)meteors.push(mkMeteor());
  }
  if(waveKills>=waveTarget){
    wave++;waveKills=0;waveTarget=8+wave*2;
    document.getElementById('waveEl').textContent='wave '+wave;
    showLyric(LYRICS[lyricIdx%LYRICS.length]);lyricIdx++;
  }
  if(screenShake>.4)screenShake*=.8;else screenShake=0;
}

function hitMeteor(m,idx){
  meteors.splice(idx,1);
  waveKills++;
  var pts=m.rare?500:10*(1+Math.floor(combo/3));
  score+=pts;
  var now=Date.now();
  if(now-lastHit<1200)combo++;else combo=1;
  lastHit=now;
  var big=m.rare||combo>=3;
  particles.push.apply(particles,mkParticles(m.x,m.y,big?18:8,m.hue,big));
  rings.push(mkRing(m.x,m.y,m.hue));
  if(big)rings.push(mkRing(m.x,m.y,m.hue+20));
  if(m.rare){Snd.rare();screenShake=10;openWishModal();}
  else{Snd.hit(big);if(combo>=3){screenShake=4;showCombo(combo);}}
  updateScore();
}

function catchPowerItem(p){
  energy=Math.min(MAX_ENERGY,energy+p.energy);
  score+=200;
  particles.push.apply(particles,mkParticles(p.x,p.y,16,p.hue,true));
  rings.push(mkRing(p.x,p.y,p.hue));
  showLyric('✦ '+p.label);
  Snd.hit(true);
  screenShake=5;
  updateScore();
  updateEnergy();
  if(energy>=MAX_ENERGY)energyBlast();
}

function energyBlast(){
  energy=0; updateEnergy();
  for(var i=0;i<meteors.length;i++){
    particles.push.apply(particles,mkParticles(meteors[i].x,meteors[i].y,14,meteors[i].hue,true));
    rings.push(mkRing(meteors[i].x,meteors[i].y,meteors[i].hue));
    score+=50; waveKills++;
  }
  meteors=[];
  screenShake=14;
  Snd.rare();
  showLyric('"falling for you"');
  updateScore();
}

function takeDamage(){
  hp--;
  screenShake=7; Snd.dmg();
  var df=document.getElementById('dmgFlash');
  df.classList.add('go'); setTimeout(function(){df.classList.remove('go');},350);
  var pct=Math.max(0,hp/MAX_HP);
  var hf=document.getElementById('hpFill');
  hf.style.width=(pct*100)+'%';
  hf.style.background=pct<.3?'rgba(255,80,80,.6)':pct<.6?'rgba(255,180,80,.4)':'rgba(232,226,210,.35)';
  if(hp<=0)endGame();
}

// AURORA HELPER - draws aurora bands on canvas context
function doAurora(ctx, w, h, strength){
  var t = Date.now() * .0005;
  var cols = [
    {hue:260, baseY:.08, heightScale:.18},
    {hue:185, baseY:.20, heightScale:.14},
    {hue:300, baseY:.12, heightScale:.16}
  ];
  cols.forEach(function(c, ci){
    var step = 4;
    for(var x = 0; x <= w; x += step){
      var nx = x / w;
      // top edge — multiple sine waves for organic shape
      var topY = h * c.baseY
        + Math.sin(t*1.1 + nx*4.2 + ci*1.4) * h*.06
        + Math.sin(t*.7  + nx*8.5 + ci*.9)  * h*.035
        + Math.sin(t*.4  + nx*2.8 + ci*2.1) * h*.05
        + Math.sin(t*1.7 + nx*12  + ci*.5)  * h*.018;
      // height — also varies per column
      var colH = h * c.heightScale
        * (0.4 + 0.6 * Math.abs(Math.sin(t*.6 + nx*3.1 + ci*1.8)));

      var grad = ctx.createLinearGradient(0, topY, 0, topY + colH);
      var a = .32 * strength;
      grad.addColorStop(0,   'rgba(0,0,0,0)');
      grad.addColorStop(.25, 'hsla('+ c.hue    +',90%,72%,'+a+')');
      grad.addColorStop(.55, 'hsla('+(c.hue+20)+',85%,78%,'+(a*.7)+')');
      grad.addColorStop(.8,  'hsla('+(c.hue+10)+',80%,70%,'+(a*.25)+')');
      grad.addColorStop(1,   'rgba(0,0,0,0)');

      ctx.fillStyle = grad;
      ctx.fillRect(x, topY, step + 1, colH);
    }
  });
}

// DRAW
function draw(ts){
  var sx=screenShake>.5?rnd(-screenShake,screenShake):0;
  var sy=screenShake>.5?rnd(-screenShake*.5,screenShake*.5):0;
  X.save();
  if(sx||sy)X.translate(sx,sy);

  X.fillStyle='#070a1a'; X.fillRect(-20,-20,W+40,H+40);
  X.fillStyle='rgba(5,6,18,0.6)'; X.fillRect(-20,-20,W+40,H*.4);

  // aurora — always visible in sky during gameplay
  doAurora(X,W,H,.55);

  bgStars.forEach(function(s){
    s.ph+=s.sp;
    X.globalAlpha=s.base*(.6+.4*Math.sin(s.ph));
    X.fillStyle='#d8d4ff';
    X.beginPath(); X.arc(s.x,s.y,s.sz,0,TAU); X.fill();
  });
  X.globalAlpha=1;

  X.fillStyle='#04060c';
  X.beginPath(); X.moveTo(0,gY);
  for(var x=0;x<=W;x+=20)X.lineTo(x,gY+Math.sin(x*.04+ts*.0002)*3);
  X.lineTo(W,H); X.lineTo(0,H); X.closePath(); X.fill();

  rings.forEach(function(r){
    var al=(1-r.r/r.maxR)*.5;
    X.globalAlpha=al; X.strokeStyle='hsl('+r.hue+',50%,75%)'; X.lineWidth=1.5;
    X.beginPath(); X.arc(r.x,r.y,r.r,0,TAU); X.stroke();
  });
  X.globalAlpha=1;

  particles.forEach(function(p){
    var al=(1-p.t/p.dur)*.85;
    X.globalAlpha=al; X.fillStyle='hsl('+p.hue+','+p.sat+'%,82%)';
    X.beginPath(); X.arc(p.x,p.y,p.r*(1-p.t/p.dur*.4),0,TAU); X.fill();
  });
  X.globalAlpha=1;

  X.fillStyle='rgba(210,200,255,.9)';
  bullets.forEach(function(b){
    if(!b.alive)return;
    X.fillRect(b.x-1.5,b.y-14,3,16);
    X.globalAlpha=.5; X.fillRect(b.x-3,b.y-16,6,4); X.globalAlpha=1;
  });

  // power items
  powerItems.forEach(function(p){
    X.save(); X.translate(p.x,p.y);
    var pulse=.9+Math.sin(p.ph)*.1;
    X.globalAlpha=.22+Math.sin(p.ph)*.08;
    X.strokeStyle='hsl('+p.hue+',60%,80%)'; X.lineWidth=1;
    X.beginPath(); X.arc(0,0,p.r*pulse*1.35,0,TAU); X.stroke();
    X.globalAlpha=.55+Math.sin(p.ph)*.15;
    X.strokeStyle='hsl('+p.hue+',70%,82%)'; X.lineWidth=1.2;
    X.beginPath(); X.arc(0,0,p.r*pulse,0,TAU); X.stroke();
    X.globalAlpha=.18; X.fillStyle='hsl('+p.hue+',60%,80%)';
    X.beginPath(); X.arc(0,0,p.r*pulse,0,TAU); X.fill();
    X.globalAlpha=.7+Math.sin(p.ph)*.2;
    X.fillStyle='hsl('+p.hue+',30%,92%)';
    X.font='11px serif'; X.textAlign='center'; X.textBaseline='middle';
    X.fillText('✦',0,0);
    X.globalAlpha=.65; X.fillStyle='hsl('+p.hue+',40%,85%)';
    X.font="9px 'Courier New',monospace"; X.textBaseline='alphabetic';
    X.fillText(p.label.toUpperCase(),0,p.r+14);
    X.globalAlpha=1; X.restore();
  });

  meteors.forEach(function(m){
    var hue=m.hue, sat=m.rare?20:45, light=m.rare?98:82;
    if(m.trail.length>1){
      for(var t=1;t<m.trail.length;t++){
        var al=(t/m.trail.length)*(m.rare?.5:.3);
        X.strokeStyle='hsla('+hue+','+sat+'%,'+light+'%,'+al+')';
        X.lineWidth=m.rare?2.2:1.4;
        X.beginPath(); X.moveTo(m.trail[t-1].x,m.trail[t-1].y); X.lineTo(m.trail[t].x,m.trail[t].y); X.stroke();
      }
    }
    if(!m.sprite)m.sprite=getStarSprite(m.r,m.hue,m.rare);
    var ss=m.sprite.width;
    X.save(); X.translate(m.x,m.y); X.rotate(m.age*(m.rare?.04:.06));
    X.drawImage(m.sprite,-ss/2,-ss/2); X.restore();
    if(m.rare){
      X.globalAlpha=.3+Math.sin(m.age*.08)*.22;
      X.strokeStyle='hsl(270,40%,88%)'; X.lineWidth=1.2;
      X.beginPath(); X.arc(m.x,m.y,m.r+5+Math.sin(m.age*.1)*3,0,TAU); X.stroke();
      X.globalAlpha=1;
      var bw=36,bx=m.x-bw/2,by=m.y-m.r-13;
      X.fillStyle='rgba(255,255,255,.1)'; X.fillRect(bx,by,bw,3);
      X.fillStyle='rgba(200,180,255,.8)'; X.fillRect(bx,by,bw*(m.hp/m.maxHp),3);
    }
  });

  // player orb
  if(phase==='playing'){
    var px=player.x,py=player.y;
    var t2=Date.now()*.001;
    X.save(); X.translate(px,py);
    X.save(); X.rotate(t2*.4);
    X.globalAlpha=.18+Math.sin(t2*1.2)*.06;
    X.strokeStyle='rgba(200,180,255,1)'; X.lineWidth=.8;
    for(var i=0;i<6;i++){
      var a=(i/6)*TAU;
      var bx2=Math.cos(a)*18,by2=Math.sin(a)*18;
      X.beginPath(); X.arc(bx2,by2,2.5,0,TAU); X.stroke();
      X.beginPath(); X.moveTo(0,0); X.lineTo(bx2,by2); X.stroke();
    }
    X.restore();
    X.save(); X.rotate(-t2*.65);
    X.globalAlpha=.12+Math.sin(t2*.9)*.05;
    X.strokeStyle='rgba(220,200,255,1)'; X.lineWidth=.6;
    X.beginPath(); X.arc(0,0,22,0,TAU); X.stroke();
    for(var i=0;i<12;i++){
      var a=(i/12)*TAU;
      X.beginPath(); X.moveTo(Math.cos(a)*19,Math.sin(a)*19); X.lineTo(Math.cos(a)*25,Math.sin(a)*25); X.stroke();
    }
    X.restore();
    X.globalAlpha=.35+Math.sin(t2*2)*.1;
    [[0,14],[Math.PI/2,10]].forEach(function(p){
      X.save(); X.rotate(p[0]);
      var sg=X.createLinearGradient(0,-p[1],0,p[1]);
      sg.addColorStop(0,'rgba(230,215,255,0)'); sg.addColorStop(.5,'rgba(230,215,255,.9)'); sg.addColorStop(1,'rgba(230,215,255,0)');
      X.fillStyle=sg; X.fillRect(-.6,-p[1],1.2,p[1]*2); X.restore();
    });
    var pulse=.88+Math.sin(t2*3.2)*.12;
    X.globalAlpha=1;
    var cg=X.createRadialGradient(0,0,0,0,0,9*pulse);
    cg.addColorStop(0,'rgba(255,252,255,.95)'); cg.addColorStop(.35,'rgba(215,200,255,.75)');
    cg.addColorStop(.7,'rgba(170,150,255,.3)'); cg.addColorStop(1,'rgba(130,110,220,0)');
    X.beginPath(); X.arc(0,0,9*pulse,0,TAU); X.fillStyle=cg; X.fill();
    X.globalAlpha=.95; X.fillStyle='rgba(255,255,255,.98)';
    X.beginPath(); X.arc(0,0,1.8,0,TAU); X.fill();
    for(var i=0;i<3;i++){
      var oa=t2*(1.2+i*.4)+(i/3)*TAU;
      var or=11+i*3;
      X.globalAlpha=.45+Math.sin(t2*2+i)*.2; X.fillStyle='rgba(210,195,255,1)';
      X.beginPath(); X.arc(Math.cos(oa)*or,Math.sin(oa)*or,1.2,0,TAU); X.fill();
    }
    for(var i=0;i<4;i++){
      X.globalAlpha=rnd(.05,.25); X.fillStyle='rgba(180,160,255,1)';
      X.beginPath(); X.arc(rnd(-4,4),rnd(8,28),rnd(.5,2),0,TAU); X.fill();
    }
    X.globalAlpha=1; X.restore();
  }

  X.restore();
}

function loop(ts){update();draw(ts);if(running)raf=requestAnimationFrame(loop);}

// UI
function updateScore(){document.getElementById('scoreEl').textContent=score.toLocaleString()+'  pts';}
function updateEnergy(){
  var pct=(energy/MAX_ENERGY)*100;
  var ef=document.getElementById('energyFill');
  if(ef){ef.style.width=pct+'%';ef.style.background=energy>=MAX_ENERGY?'rgba(220,170,255,.9)':'rgba(200,170,255,.55)';}
}
function showCombo(n){
  var el=document.getElementById('comboEl');
  el.textContent=n>=5?n+'x ✦':n+'x combo';
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
}
function showLyric(t){
  var el=document.getElementById('lyricEl');
  el.textContent=t; el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
}
var _tt=null;
function toast(m){
  var el=document.getElementById('toast'); el.textContent=m; el.classList.add('on');
  clearTimeout(_tt); _tt=setTimeout(function(){el.classList.remove('on');},2400);
}
function showScreen(id){document.querySelectorAll('.scr').forEach(function(s){s.classList.remove('on');});document.getElementById(id).classList.add('on');}

// WISH
function openWishModal(){
  running=false;
  document.getElementById('wishInput').value='';
  document.getElementById('wishModal').classList.add('on');
  setTimeout(function(){document.getElementById('wishInput').focus();},350);
}
function closeWishModal(txt){
  document.getElementById('wishModal').classList.remove('on');
  document.getElementById('wishInput').blur();
  lastWishText=txt&&txt.trim()?txt.trim():'';
  if(lastWishText)showLyric('"'+lastWishText+'"');
  Snd.rare();
  running=true;
  raf=requestAnimationFrame(loop);
}

// CAPTURE EFFECTS
function applySnapEffects(){
  var t=Date.now()*.0008;
  X.save();
  X.fillStyle='rgba(4,3,18,.28)'; X.fillRect(0,0,W,H);
  // aurora pass 1
  doAurora(X,W,H,1.4);
  // ridges
  X.globalAlpha=.28; X.fillStyle='rgba(20,12,45,1)';
  X.beginPath(); X.moveTo(0,H);
  for(var rx=0;rx<=W;rx+=8)X.lineTo(rx,gY*.7+Math.sin(rx*.008+1.2)*H*.07+Math.sin(rx*.02+.4)*H*.035);
  X.lineTo(W,H); X.closePath(); X.fill();
  X.globalAlpha=.6; X.fillStyle='rgba(5,3,14,1)';
  X.beginPath(); X.moveTo(0,H);
  for(var rx=0;rx<=W;rx+=6)X.lineTo(rx,gY*.85+Math.sin(rx*.011+.7)*H*.04+Math.sin(rx*.025+1.9)*H*.025);
  X.lineTo(W,H); X.closePath(); X.fill();
  X.globalAlpha=.9; X.fillStyle='rgba(2,1,8,1)';
  X.beginPath(); X.moveTo(0,H);
  for(var rx=0;rx<=W;rx+=5)X.lineTo(rx,gY*.95+Math.sin(rx*.014+.3)*H*.025);
  X.lineTo(W,H); X.closePath(); X.fill();
  X.globalAlpha=1;
  // aurora pass 2 (above ridges)
  doAurora(X,W,H,.7);
  // particles
  for(var i=0;i<55;i++){
    var px=rnd(0,W),py=rnd(0,H*.78),pr=rnd(.2,1.6),pa=rnd(.12,.6),ph=rnd(210,300);
    X.globalAlpha=pa; X.fillStyle='hsl('+ph+',60%,90%)';
    X.beginPath(); X.arc(px,py,pr,0,TAU); X.fill();
    if(pr>1){
      X.globalAlpha=pa*.35; X.strokeStyle='hsl('+ph+',50%,92%)'; X.lineWidth=.5;
      X.beginPath(); X.moveTo(px-pr*3.5,py); X.lineTo(px+pr*3.5,py); X.stroke();
      X.beginPath(); X.moveTo(px,py-pr*3.5); X.lineTo(px,py+pr*3.5); X.stroke();
    }
  }
  X.globalAlpha=1;
  // wish text
  if(lastWishText){
    var fs=Math.min(W/18,32);
    X.font='italic '+fs+'px Georgia,serif'; X.textAlign='center';
    X.shadowColor='rgba(180,150,255,.9)'; X.shadowBlur=26;
    X.fillStyle='rgba(225,215,255,.78)';
    X.fillText('"'+lastWishText+'"',W/2,H*.25);
    X.font=(fs*.7)+'px serif';
    var tw=X.measureText('"'+lastWishText+'"').width;
    X.fillText('✦',W/2-tw/2-18,H*.25); X.fillText('✦',W/2+tw/2+18,H*.25);
    X.shadowBlur=0;
  }
  // vignette
  var vg=X.createLinearGradient(0,0,0,H);
  vg.addColorStop(0,'rgba(3,2,14,.38)'); vg.addColorStop(.2,'rgba(3,2,14,0)');
  vg.addColorStop(.8,'rgba(3,2,14,0)'); vg.addColorStop(1,'rgba(3,2,14,.5)');
  X.fillStyle=vg; X.fillRect(0,0,W,H);
  X.restore();
}

// GAME FLOW
function startGame(){
  Snd.init();
  bullets=[];meteors=[];particles=[];rings=[];powerItems=[];
  hp=MAX_HP;score=0;combo=0;lastHit=0;energy=0;
  wave=1;waveTimer=0;waveKills=0;waveTarget=8;
  screenShake=0;lastWishText='';lyricIdx=0;shooting=false;
  player.x=player.tx=W/2; player.y=player.ty=H*.82;
  var hf=document.getElementById('hpFill');
  hf.style.width='100%'; hf.style.background='rgba(232,226,210,.35)';
  document.getElementById('energyFill').style.width='0%';
  document.getElementById('waveEl').textContent='wave 1';
  updateScore();
  running=true; phase='playing';
  showScreen('hud');
  document.getElementById('snapBtn').style.display='flex';
  var bgm=document.getElementById('bgm');
  bgm.currentTime=0; bgm.volume=0.15;
  bgm.play().catch(function(){});
  raf=requestAnimationFrame(loop);
}

function endGame(){
  running=false; phase='ended'; Snd.fadeOut();
  document.getElementById('snapBtn').style.display='none';
  var bgm=document.getElementById('bgm'); bgm.pause(); bgm.currentTime=0;
  meteors=[];bullets=[];
  setTimeout(doShutter,600);
}

function doShutter(){
  Snd.shutter();
  var fl=document.getElementById('flash');
  fl.classList.add('go'); setTimeout(function(){fl.classList.remove('go');},500);
  requestAnimationFrame(function(){setTimeout(function(){
    applySnapEffects();
    var snap=C.toDataURL('image/jpeg',.92);
    if(phase==='paused')showPausedPolaroid(snap);
    else showPolaroid(snap);
  },100);});
}

function midGameSnap(){
  if(phase!=='playing')return;
  running=false; clearInterval(ticker); shooting=false; phase='paused';
  doShutter();
}

function showPolaroid(snap){
  var img=document.getElementById('snapImg');
  img.src=snap; img.classList.remove('dev');
  document.getElementById('bmeta').textContent=lastWishText?'✦ "'+lastWishText+'"':(score.toLocaleString()+' pts · wave '+wave);
  showScreen('end');
  var pol=document.getElementById('pol'),br=document.getElementById('brow');
  pol.classList.remove('show'); br.classList.remove('show');
  setTimeout(function(){
    pol.classList.add('show');
    setTimeout(function(){img.classList.add('dev');},280);
    setTimeout(function(){br.classList.add('show');},430);
  },80);
}

function showPausedPolaroid(snap){
  var ag=document.getElementById('againBtn');
  ag.textContent='Resume'; ag.onclick=resumeGame;
  showPolaroid(snap);
}

function resumeGame(){
  var ag=document.getElementById('againBtn');
  ag.textContent='Again'; ag.onclick=restart;
  document.getElementById('pol').classList.remove('show');
  document.getElementById('brow').classList.remove('show');
  document.getElementById('snapImg').classList.remove('dev');
  document.getElementById('snapBtn').style.display='flex';
  phase='playing'; running=true;
  showScreen('hud');
  ticker=setInterval(function(){},1000);
  raf=requestAnimationFrame(loop);
}

function restart(){
  document.getElementById('pol').classList.remove('show');
  document.getElementById('brow').classList.remove('show');
  document.getElementById('snapImg').classList.remove('dev');
  document.getElementById('snapBtn').style.display='none';
  var bgm=document.getElementById('bgm'); bgm.pause(); bgm.currentTime=0;
  phase='intro'; showScreen('intro');
  bullets=[];meteors=[];particles=[];rings=[];powerItems=[];running=false;
}

// INSTAGRAM
function shareToInstagramStory(){
  var gameSnap=document.getElementById('snapImg').src;
  if(!gameSnap){toast('play first!');return;}
  var SW=1080,SH=1920;
  var sc=document.createElement('canvas'); sc.width=SW; sc.height=SH;
  var ctx=sc.getContext('2d');
  ctx.fillStyle='#050818'; ctx.fillRect(0,0,SW,SH);
  for(var i=0;i<200;i++){
    var sx=Math.random()*SW,sy=Math.random()*SH*.75,sr=Math.random()*1.8,sa=Math.random()*.8+.1;
    ctx.globalAlpha=sa; ctx.fillStyle='#d8d4ff';
    ctx.beginPath(); ctx.arc(sx,sy,sr,0,TAU); ctx.fill();
  }
  ctx.globalAlpha=1;
  var gi=new Image();
  gi.onload=function(){
    var PW=780,PH=680,PX=(SW-PW)/2,PY=380;
    ctx.fillStyle='#f0ead8'; ctx.fillRect(PX,PY,PW,PH+180);
    ctx.drawImage(gi,PX+24,PY+24,PW-48,PH-24);
    ctx.fillStyle='#ede8df'; ctx.fillRect(PX,PY+PH,PW,180);
    ctx.fillStyle='#d8d2c8'; ctx.fillRect(PX+24,PY+PH,PW-48,1);
    ctx.textAlign='center';
    ctx.fillStyle='#1a1510'; ctx.font='italic 52px Georgia,serif'; ctx.fillText('Falling for You',SW/2,PY+PH+72);
    ctx.fillStyle='#888'; ctx.font="26px 'Courier New',monospace"; ctx.fillText('IAN CHUNG x MARTELLO',SW/2,PY+PH+118);
    if(lastWishText){
      ctx.font='italic 56px Georgia,serif'; ctx.fillStyle='rgba(220,210,255,.9)';
      ctx.shadowColor='rgba(180,150,255,.8)'; ctx.shadowBlur=28;
      ctx.fillText('"'+lastWishText+'"',SW/2,PY-80); ctx.shadowBlur=0;
      ctx.font='34px serif'; ctx.fillStyle='rgba(220,210,255,.6)';
      var tw=ctx.measureText('"'+lastWishText+'"').width;
      ctx.fillText('✦',SW/2-tw/2-38,PY-80); ctx.fillText('✦',SW/2+tw/2+38,PY-80);
    }
    ctx.font="20px 'Courier New',monospace"; ctx.fillStyle='rgba(200,190,255,.28)'; ctx.fillText('@ianc.hung',SW/2,SH-58);
    sc.toBlob(function(blob){
      if(!blob)return;
      var file=new File([blob],'falling_for_you_story.jpg',{type:'image/jpeg'});
      if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
        navigator.share({files:[file],title:'Falling for You'}).then(function(){showIgOverlay();}).catch(function(e){if(e.name!=='AbortError'){doDownload(blob);showIgOverlay();}});
      } else {doDownload(blob);showIgOverlay();}
    },'image/jpeg',.95);
  };
  gi.src=gameSnap;
}

function doDownload(blob){
  var url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url; a.download='falling_for_you_story.jpg'; a.click();
  setTimeout(function(){URL.revokeObjectURL(url);},1000);
}

  var ex=document.getElementById('igOverlay'); if(ex)ex.remove();
  var ov=document.createElement('div'); ov.id='igOverlay';
  ov.style.cssText='position:fixed;inset:0;z-index:80;background:rgba(3,4,14,.88);display:flex;align-items:center;justify-content:center;font-family:\'Courier New\',monospace';
  ov.innerHTML='<style>@keyframes fi{from{opacity:0}to{opacity:1}}#igB{animation:fi .4s ease;display:flex;flex-direction:column;align-items:center;gap:16px;max-width:min(300px,84vw);text-align:center}#igT{font-family:Georgia,serif;font-style:italic;font-size:16px;color:rgba(232,226,210,.88);line-height:1.6}#igS{font-size:9px;color:rgba(200,180,255,.38);letter-spacing:.18em;text-transform:uppercase;line-height:1.8}#igO{background:linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045);border:none;color:#fff;padding:14px 0;letter-spacing:.2em;font-size:11px;font-family:\'Courier New\',monospace;cursor:pointer;text-transform:uppercase;width:100%;min-height:50px}#igD{background:transparent;border:1px solid rgba(232,226,210,.18);color:rgba(232,226,210,.36);padding:11px 0;letter-spacing:.2em;font-size:10px;font-family:\'Courier New\',monospace;cursor:pointer;text-transform:uppercase;width:100%;min-height:44px}</style><div id="igB"><div style="font-size:36px">✦</div><div id="igT">공유 시트에서<br>"이미지 저장" 탭 후<br>사진 앱에 저장됩니다</div><div id="igS">그 다음 인스타그램 스토리 추가<br>갤러리에서 이미지 선택</div><button id="igO">Open Instagram</button><button id="igD">Done</button></div>';

document.body.appendChild(ov);
document.getElementById(‘igO’).onclick=function(){
window.location.href=‘instagram://story-camera’;
setTimeout(function(){
if(/iphone|ipad|ipod/i.test(navigator.userAgent))window.location.href=‘https://apps.apple.com/app/instagram/id389801252’;
else window.open(‘https://play.google.com/store/apps/details?id=com.instagram.android’,’_blank’);
},1500);
};
document.getElementById(‘igD’).onclick=function(){ov.remove();};
}

function doSave(){
var snap=document.getElementById(‘snapImg’).src; if(!snap)return;
var PW=640,PH=760,PAD=22,PHOTO_W=596,PHOTO_H=536;
var pc=document.createElement(‘canvas’); pc.width=PW; pc.height=PH;
var ct=pc.getContext(‘2d’);
ct.fillStyle=’#f2ede4’; ct.fillRect(0,0,PW,PH);
var img=new Image();
img.onload=function(){
var iw=img.naturalWidth,ih=img.naturalHeight;
var scale=Math.max(PHOTO_W/iw,PHOTO_H/ih);
var dw=iw*scale,dh=ih*scale;
var dx=PAD+(PHOTO_W-dw)/2,dy=PAD+(PHOTO_H-dh)/2;
ct.save(); ct.beginPath(); ct.rect(PAD,PAD,PHOTO_W,PHOTO_H); ct.clip();
ct.drawImage(img,dx,dy,dw,dh); ct.restore();
var stripY=PAD+PHOTO_H;
ct.fillStyle=’#ede8df’; ct.fillRect(0,stripY,PW,PH-stripY);
ct.fillStyle=’#d8d2c8’; ct.fillRect(PAD,stripY,PHOTO_W,1);
ct.textAlign=‘center’;
ct.fillStyle=’#1a1510’; ct.font=‘italic 26px Georgia,serif’; ct.fillText(‘Falling for You’,PW/2,stripY+52);
ct.fillStyle=’#888’; ct.font=“13px ‘Courier New’,monospace”; ct.fillText(‘IAN CHUNG x MARTELLO’,PW/2,stripY+82);
ct.fillStyle=’#bbb’; ct.font=“11px ‘Courier New’,monospace”;
var meta=lastWishText?‘✦ “’+lastWishText+’”’:(score.toLocaleString()+’ pts · wave ‘+wave);
ct.fillText(meta.length>42?meta.slice(0,42)+’…’:meta,PW/2,stripY+100);
ct.fillStyle=’#c0b0a0’; ct.font=“10px ‘Courier New’,monospace”;
ct.fillText(‘OUT ON JUNE 5, 2026’,PW/2,stripY+122);
pc.toBlob(function(blob){
var file=new File([blob],‘falling_for_you.jpg’,{type:‘image/jpeg’});
if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file]});}
else{var url=URL.createObjectURL(blob),a=document.createElement(‘a’);a.href=url;a.download=‘falling_for_you.jpg’;a.click();setTimeout(function(){URL.revokeObjectURL(url);},1000);}
},‘image/jpeg’,.95);
};
img.src=snap;
}

// EVENTS
var lastT=0;
function bindBtn(id,fn){
var el=document.getElementById(id); if(!el)return;
el.addEventListener(‘touchend’,function(e){e.preventDefault();e.stopPropagation();lastT=Date.now();fn();},{passive:false});
el.addEventListener(‘click’,function(e){if(Date.now()-lastT<400)return;fn();});
}
bindBtn(‘beginBtn’,startGame);
bindBtn(‘snapBtn’,midGameSnap);
bindBtn(‘saveBtn’,doSave);
bindBtn(‘igBtn’,shareToInstagramStory);
bindBtn(‘againBtn’,restart);
bindBtn(‘wishSendBtn’,function(){closeWishModal(document.getElementById(‘wishInput’).value);});
document.getElementById(‘wishInput’).addEventListener(‘keydown’,function(e){if(e.key===‘Enter’){e.preventDefault();closeWishModal(e.target.value);}});

window.addEventListener(‘mousemove’,function(e){if(phase!==‘playing’)return;player.tx=e.clientX;player.ty=Math.max(H*.45,Math.min(H*.93,e.clientY));});
window.addEventListener(‘mousedown’,function(e){if(phase!==‘playing’)return;if(e.target.tagName===‘BUTTON’||e.target.id===‘wishInput’)return;shooting=true;tryShoot();});
window.addEventListener(‘mouseup’,function(){shooting=false;});

function handleTouch(e){if(phase!==‘playing’)return;var t=e.touches[0];if(!t)return;player.tx=t.clientX;player.ty=Math.max(H*.45,Math.min(H*.93,t.clientY));}
document.addEventListener(‘touchstart’,function(e){if(phase!==‘playing’)return;if(e.target.tagName===‘BUTTON’||e.target.id===‘wishInput’)return;lastT=Date.now();shooting=true;handleTouch(e);tryShoot();},{passive:true});
document.addEventListener(‘touchmove’,function(e){if(phase!==‘playing’)return;handleTouch(e);},{passive:true});
document.addEventListener(‘touchend’,function(e){if(e.target.tagName===‘BUTTON’||e.target.id===‘wishInput’)return;shooting=false;});

setInterval(function(){if(shooting&&phase===‘playing’)tryShoot();},SHOOT_CD);
window.addEventListener(‘resize’,resize);
resize();
raf=requestAnimationFrame(draw);
</script>
